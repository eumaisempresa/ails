<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matéria | Revista Gestão & Futuro⁺</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #060E18;
            --card-bg: #0A1624;
            --dourado: #C4974A;
            --texto: #EEF0F2;
            --texto-sec: #A0AEC0;
            --bordas: rgba(196,151,74,0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-dark); color: var(--texto); font-family: 'DM Sans', sans-serif; line-height: 1.7; padding: 40px 20px; }
        .article-container { max-width: 800px; margin: 0 auto; background: var(--card-bg); border: 1px solid var(--bordas); padding: 40px; border-radius: 8px; }

        .tag-edicao { color: var(--dourado); font-size: 12px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 15px; }
        h1.titulo { font-family: 'Cormorant Garamond', serif; font-size: 38px; color: #fff; line-height: 1.2; margin-bottom: 15px; }
        p.chamada { font-size: 18px; color: var(--texto-sec); margin-bottom: 25px; }

        .meta-info { display: flex; gap: 20px; font-size: 13px; color: var(--dourado); border-top: 1px solid var(--bordas); border-bottom: 1px solid var(--bordas); padding: 10px 0; margin-bottom: 30px; }

        .box-escuro { background: #040910; border-left: 4px solid var(--dourado); padding: 20px; margin-bottom: 30px; border-radius: 0 6px 6px 0; }
        .box-escuro h3 { color: var(--dourado); font-size: 16px; margin-bottom: 8px; }

        .secao-titulo { font-family: 'Cormorant Garamond', serif; font-size: 24px; color: var(--dourado); margin: 30px 0 15px 0; }

        .quote-box { text-align: center; border-top: 1px solid var(--bordas); border-bottom: 1px solid var(--bordas); padding: 30px 20px; margin: 40px 0; }
        .quote-box p { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-style: italic; color: #fff; }
        .quote-box span { font-size: 12px; color: var(--dourado); letter-spacing: 1px; margin-top: 10px; display: block; }

        .box-nota { background: rgba(196,151,74,0.1); border: 1px solid var(--dourado); padding: 20px; border-radius: 6px; margin: 30px 0; }

        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .card-list { background: #060E18; border: 1px solid var(--bordas); padding: 20px; border-radius: 6px; }
        .card-list h4 { color: var(--dourado); margin-bottom: 15px; font-size: 14px; }
        .card-list ul { padding-left: 18px; font-size: 14px; }

        .tags-container { margin-top: 40px; border-top: 1px solid var(--bordas); padding-top: 20px; }
        .tag-btn { background: #0E1E30; color: var(--dourado); padding: 6px 12px; border-radius: 4px; font-size: 12px; margin-right: 8px; display: inline-block; margin-bottom: 8px; }
        .hashtags { color: var(--dourado); font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="article-container" id="artigo-content">
        <p style="color: var(--texto-sec)">Carregando matéria...</p>
    </div>

    <script>
        const APPSCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwkzGw0ltxz2O4INiSCbyEP25CK8mytcJmu2hnG6tUlq3JMhNT9etOxDhoAfU5HLt3D/exec';

        async function carregarMateria() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            if (!id) {
                document.getElementById('artigo-content').innerHTML = '<h2>Matéria não informada!</h2>';
                return;
            }

            try {
                const res = await fetch(`${APPSCRIPT_URL}?action=getMateria&id=${id}`);
                const m = await res.json();

                if (m.erro) {
                    document.getElementById('artigo-content').innerHTML = '<h2>Matéria não encontrada!</h2>';
                    return;
                }

                const aprendizadosHTML = m.aprendizados_itens ? m.aprendizados_itens.split('||').map(i => `<li>${i}</li>`).join('') : '';
                const praticasHTML = m.praticas_itens ? m.praticas_itens.split('||').map(i => `<li>${i}</li>`).join('') : '';
                const tagsHTML = m.tags ? m.tags.split(',').map(t => `<span class="tag-btn">${t.trim()}</span>`).join('') : '';

                document.getElementById('artigo-content').innerHTML = `
                    <div class="tag-edicao">${m.edicao}</div>
                    <h1 class="titulo">${m.tema}</h1>
                    <p class="chamada">${m.chamada}</p>
                    
                    <div class="meta-info">
                        <span>Por <strong>${m.autor}</strong></span>
                        <span>• Tempo de Leitura: ${m.tempo_leitura}</span>
                        <span>• Data: ${m.data}</span>
                    </div>

                    ${m.box_reflexao_texto ? `
                        <div class="box-escuro">
                            <h3>${m.box_reflexao_titulo}</h3>
                            <p>${m.box_reflexao_texto}</p>
                        </div>
                    ` : ''}

                    <h2 class="secao-titulo">${m.resumo_executivo_titulo}</h2>
                    <p>${m.resumo_executivo_corpo.replace(/\n/g, '<br>')}</p>

                    <h2 class="secao-titulo">${m.conteudo_titulo}</h2>
                    <p>${m.conteudo_intro.replace(/\n/g, '<br>')}</p>

                    ${m.destaque_central_texto ? `
                        <div class="quote-box">
                            <p>“${m.destaque_central_texto}”</p>
                            <span>${m.destaque_central_ref}</span>
                        </div>
                    ` : ''}

                    ${m.conteudo_bloco1 ? `<p>${m.conteudo_bloco1.replace(/\n/g, '<br>')}</p><br>` : ''}
                    ${m.conteudo_bloco2 ? `<p>${m.conteudo_bloco2.replace(/\n/g, '<br>')}</p><br>` : ''}
                    ${m.conteudo_bloco3 ? `<p>${m.conteudo_bloco3.replace(/\n/g, '<br>')}</p><br>` : ''}

                    ${m.nota_editor_texto ? `
                        <div class="box-nota">
                            <strong>${m.nota_editor_titulo}</strong>
                            <p>${m.nota_editor_texto}</p>
                        </div>
                    ` : ''}

                    <div class="grid-2col">
                        ${aprendizadosHTML ? `
                            <div class="card-list">
                                <h4>${m.aprendizados_titulo}</h4>
                                <ul>${aprendizadosHTML}</ul>
                            </div>
                        ` : ''}
                        ${praticasHTML ? `
                            <div class="card-list">
                                <h4>${m.praticas_titulo}</h4>
                                <ul>${praticasHTML}</ul>
                            </div>
                        ` : ''}
                    </div>

                    <div class="tags-container">
                        ${tagsHTML}
                        <div class="hashtags">${m.hashtags}</div>
                    </div>
                `;
            } catch (err) {
                document.getElementById('artigo-content').innerHTML = '<h2>Erro ao carregar artigo.</h2>';
            }
        }

        document.addEventListener('DOMContentLoaded', carregarMateria);
    </script>
</body>
</html>
