<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Lavanderia · Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F4F8F7;
  --surface:#FFFFFF;
  --surface-soft:#EAF1EF;
  --ink:#132A2C;
  --ink-soft:#5B7378;
  --line:#DCE7E4;
  --primary:#1E5F63;
  --primary-dark:#0F3B3E;
  --primary-tint:#DCEEEC;
  --accent:#E4622F;
  --accent-tint:#FDE7DD;
  --success:#3F8F5F;
  --success-tint:#E1F2E7;
  --warning:#C98A1F;
  --warning-tint:#FBEED9;
  --danger:#C4483A;
  --danger-tint:#FBE4E0;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 2px 10px rgba(15,59,62,.06), 0 1px 2px rgba(15,59,62,.08);
  --font-display:"Fraunces", serif;
  --font-body:"Inter", sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased;}
body{min-height:100vh; overscroll-behavior-y:none;}
h1,h2,h3{font-family:var(--font-display); font-weight:600; margin:0; letter-spacing:-.01em;}
p{margin:0;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:16px;}
a{color:inherit;}
::selection{background:var(--primary-tint);}

/* ============ LAYOUT SHELL ============ */
#app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}
.hidden{display:none !important;}

/* ============ LOGIN ============ */
#tela-login{
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:32px 24px; background:
    radial-gradient(circle at 15% 8%, rgba(30,95,99,.16), transparent 55%),
    radial-gradient(circle at 85% 92%, rgba(228,98,47,.10), transparent 45%),
    var(--bg);
}
.marca{display:flex; align-items:center; gap:12px; margin-bottom:36px;}
.marca-icone{width:44px; height:44px; flex-shrink:0;}
.marca-texto{font-family:var(--font-display); font-size:23px; font-weight:600; color:var(--primary-dark); line-height:1.1;}
.marca-texto span{display:block; font-family:var(--font-body); font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin-top:2px;}
.card-login{background:var(--surface); border-radius:20px; padding:30px 26px; width:100%; max-width:380px; box-shadow:var(--shadow); border:1px solid var(--line);}
.card-login h1{font-size:21px; margin-bottom:6px;}
.card-login .sub{color:var(--ink-soft); font-size:14px; margin-bottom:22px;}
.campo{margin-bottom:16px;}
.campo label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}
.campo input, .campo select, .campo textarea{
  width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:var(--radius-sm);
  background:var(--bg); color:var(--ink); transition:border-color .15s, background .15s;
}
.campo input:focus, .campo select:focus, .campo textarea:focus{outline:none; border-color:var(--primary); background:var(--surface);}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
  padding:13px 18px; border-radius:999px; border:none; font-weight:700; font-size:15px;
  background:var(--primary); color:#fff; transition:transform .12s, background .15s;
}
.btn:active{transform:scale(.97);}
.btn:hover{background:var(--primary-dark);}
.btn.secundario{background:var(--surface-soft); color:var(--primary-dark);}
.btn.secundario:hover{background:var(--line);}
.btn.contorno{background:transparent; color:var(--primary); border:1.5px solid var(--primary);}
.btn.perigo{background:var(--danger);}
.btn.pequeno{width:auto; padding:8px 16px; font-size:13px;}
.link-sutil{background:none; border:none; color:var(--ink-soft); font-size:13px; text-decoration:underline; text-underline-offset:3px; padding:6px; margin-top:4px;}
.erro-msg{background:var(--danger-tint); color:var(--danger); font-size:13px; padding:10px 12px; border-radius:var(--radius-sm); margin-bottom:14px; font-weight:600;}
.ok-msg{background:var(--success-tint); color:var(--success); font-size:13px; padding:10px 12px; border-radius:var(--radius-sm); margin-bottom:14px; font-weight:600;}

/* ============ APP SHELL ============ */
#app-shell{display:flex; flex-direction:column; min-height:100vh;}
.topo{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
  padding:16px 18px; background:var(--primary); color:#fff;
}
.topo-titulo{font-family:var(--font-display); font-size:18px; font-weight:600;}
.topo-titulo span{display:block; font-family:var(--font-body); font-size:11px; font-weight:500; color:rgba(255,255,255,.72); text-transform:capitalize;}
.avatar-btn{width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.16); border:none; color:#fff; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center;}
.linha-datas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 10px;margin-top:10px;color:var(--ink-soft);font-size:11px;}
.linha-datas span{padding:5px 7px;background:var(--surface-soft);border-radius:8px;}
.comparacao-despesas{margin-top:16px;}
.comparacao-despesas .tabela-scroll{overflow-x:auto;}
.comparacao-despesas table{width:100%;border-collapse:collapse;font-size:12px;}
.comparacao-despesas th,.comparacao-despesas td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);white-space:nowrap;}
.comparacao-despesas th{color:var(--ink-soft);font-weight:700;}
@media print{
  .sem-impressao,.nav-inferior,.fab,.modal-fundo,#toast{display:none!important;}
  body{background:#fff!important;color:#111!important;}
  #app-shell{display:block!important;min-height:0!important;}
  .topo{position:static!important;background:#fff!important;color:#111!important;border-bottom:1px solid #ccc;}
  .topo-titulo,.topo-titulo span{color:#111!important;}
  #conteudo{overflow:visible!important;padding:12px!important;}
  .cartao,.stat-card{break-inside:avoid;box-shadow:none!important;border:1px solid #ccc!important;}
}

#conteudo{flex:1; padding:18px 16px 90px; overflow-y:auto;}
.tela{animation:surgir .25s ease;}
@keyframes surgir{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.nav-inferior{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px;
  display:flex; background:var(--surface); border-top:1px solid var(--line); z-index:30;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-item{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 4px 8px;
  background:none; border:none; color:var(--ink-soft); font-size:11px; font-weight:600;
}
.nav-item svg{width:21px; height:21px;}
.nav-item.ativo{color:var(--primary);}
.nav-item.ativo svg{stroke:var(--primary);}

/* ============ COMPONENTES GERAIS ============ */
.secao-titulo{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.secao-titulo h2{font-size:20px;}
.eyebrow{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--primary);}

.dashboard-filtros{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.dashboard-filtros select{max-width:160px;}
.grid-stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;}
.stat-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px;}
.cliente-painel{padding:14px;}
@media (min-width:720px){.cliente-painel{display:inline-block;vertical-align:top;width:calc(50% - 8px);margin-right:8px;}.dashboard-filtros select{max-width:220px;}}
.stat-card .num{font-family:var(--font-display); font-size:26px; font-weight:600; color:var(--primary-dark);}
.stat-card .lbl{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.stat-card.laranja .num{color:var(--accent);}

.cartao{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:12px;}
.cartao-linha{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.cartao h3{font-size:15.5px;}
.cartao .meta{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px;}
.badge.recebido{background:var(--warning-tint); color:var(--warning);}
.badge.lavagem{background:var(--primary-tint); color:var(--primary);}
.badge.passagem{background:#E3E4FB; color:#4C4FC4;}
.badge.pronto{background:var(--accent-tint); color:var(--accent);}
.badge.retirado{background:var(--success-tint); color:var(--success);}
.badge.cancelado{background:var(--danger-tint); color:var(--danger);}

/* ---- Varal (assinatura visual do status de produção) ---- */
.varal{position:relative; margin:16px 2px 6px; height:44px;}
.varal-corda{position:absolute; top:14px; left:0; right:0; height:2px; background:var(--line);}
.varal-etapas{position:relative; display:flex; justify-content:space-between;}
.varal-pino{display:flex; flex-direction:column; align-items:center; gap:6px; flex:1;}
.varal-peca{
  width:15px; height:15px; border-radius:3px 3px 8px 8px; border:2px solid var(--line); background:var(--surface);
  transform:rotate(0deg);
}
.varal-pino.concluido .varal-peca{background:var(--primary); border-color:var(--primary);}
.varal-pino.atual .varal-peca{background:var(--accent); border-color:var(--accent); animation:balancar 1.6s ease-in-out infinite;}
@keyframes balancar{0%,100%{transform:rotate(-6deg);} 50%{transform:rotate(6deg);}}
.varal-rotulo{font-size:9.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.02em; text-align:center;}
.varal-pino.concluido .varal-rotulo, .varal-pino.atual .varal-rotulo{color:var(--ink);}

.busca-wrap{display:flex; gap:8px; margin-bottom:16px;}
.busca-wrap input{flex:1;}
.fab{
  position:fixed; bottom:86px; right:calc(50% - 260px + 18px); width:54px; height:54px; border-radius:50%;
  background:var(--accent); color:#fff; border:none; font-size:26px; box-shadow:0 6px 18px rgba(228,98,47,.4);
  display:flex; align-items:center; justify-content:center; z-index:25;
}
@media (max-width:560px){ .fab{ right:18px; } }

.vazio{text-align:center; padding:50px 20px; color:var(--ink-soft);}
.vazio h3{color:var(--ink); font-size:16px; margin-bottom:6px;}
.vazio p{font-size:13.5px;}

.filtros-chip{display:flex; gap:8px; overflow-x:auto; margin-bottom:16px; padding-bottom:2px;}
.chip{flex-shrink:0; padding:7px 14px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); font-size:12.5px; font-weight:600; color:var(--ink-soft); white-space:nowrap;}
.chip.ativo{background:var(--primary); border-color:var(--primary); color:#fff;}

.lista-clean li{list-style:none;}
.item-linha{display:flex; justify-content:space-between; padding:6px 0; font-size:13.5px;}
.item-linha .k{color:var(--ink-soft);}
.item-linha .v{font-weight:700;}

/* ---- Modal ---- */
.modal-fundo{position:fixed; inset:0; background:rgba(15,42,44,.42); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
.modal-fundo.centro{align-items:center; padding:20px;}
.modal-caixa{background:var(--surface); width:100%; max-width:520px; border-radius:22px 22px 0 0; padding:22px 20px calc(24px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; animation:subir .25s ease;}
.modal-fundo.centro .modal-caixa{border-radius:20px; max-width:400px;}
@keyframes subir{from{transform:translateY(24px); opacity:.4;} to{transform:translateY(0); opacity:1;}}
.modal-cabecalho{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-cabecalho h2{font-size:18px;}
.fechar-x{background:var(--surface-soft); border:none; width:30px; height:30px; border-radius:50%; font-size:16px; color:var(--ink-soft); display:flex; align-items:center; justify-content:center;}
.linha-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

.toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 20px; border-radius:999px; font-size:13.5px; font-weight:600; z-index:80; box-shadow:0 8px 20px rgba(0,0,0,.2); max-width:88%; text-align:center;}

.tabs-topo{display:flex; gap:6px; background:var(--surface-soft); padding:4px; border-radius:999px; margin-bottom:18px;}
.tab-topo{flex:1; padding:9px; border:none; background:none; border-radius:999px; font-weight:700; font-size:12.5px; color:var(--ink-soft);}
.tab-topo.ativo{background:var(--surface); color:var(--primary); box-shadow:var(--shadow);}

.carregando{display:flex; align-items:center; justify-content:center; padding:40px; color:var(--ink-soft); font-size:13.5px; gap:10px;}
.spin{width:16px; height:16px; border:2.5px solid var(--line); border-top-color:var(--primary); border-radius:50%; animation:girar .7s linear infinite;}
@keyframes girar{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app">

  <!-- ================= LOGIN ================= -->
  <div id="tela-login">
    <div class="marca">
      <svg class="marca-icone" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="22" fill="#1E5F63"/>
        <path d="M14 24c0-6 4-10 10-10s10 4 10 10-4 10-10 10" stroke="#DCEEEC" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        <circle cx="24" cy="24" r="4.2" fill="#E4622F"/>
      </svg>
      <div class="marca-texto">Lavanderia<span>Painel de gestão</span></div>
    </div>

    <div class="card-login">
      <div id="login-passo-entrar">
        <h1>Entrar</h1>
        <p class="sub">Acesse com seu e-mail cadastrado</p>
        <div id="login-erro" class="erro-msg hidden"></div>
        <form id="form-login">
          <div class="campo">
            <label>E-mail</label>
            <input type="email" id="login-email" required autocomplete="username">
          </div>
          <div class="campo">
            <label>Senha</label>
            <input type="password" id="login-senha" required autocomplete="current-password">
          </div>
          <button class="btn" type="submit" id="btn-entrar">Entrar</button>
        </form>
        <button class="link-sutil" onclick="mostrarRecuperar()">Esqueci minha senha</button>
      </div>

      <div id="login-passo-recuperar" class="hidden">
        <h1>Recuperar senha</h1>
        <p class="sub">Enviaremos uma nova senha para o seu e-mail</p>
        <div id="recuperar-msg" class="hidden"></div>
        <form id="form-recuperar">
          <div class="campo">
            <label>E-mail</label>
            <input type="email" id="recuperar-email" required>
          </div>
          <button class="btn" type="submit">Enviar nova senha</button>
        </form>
        <button class="link-sutil" onclick="mostrarEntrar()">Voltar para o login</button>
      </div>
    </div>
  </div>

  <!-- ================= APP ================= -->
  <div id="app-shell" class="hidden">
    <header class="topo sem-impressao">
      <div class="topo-titulo" id="topo-titulo">Painel<span id="topo-sub">—</span></div>
      <button class="avatar-btn" onclick="abrirPerfil()" id="avatar-iniciais">–</button>
    </header>

    <main id="conteudo"></main>

    <nav class="nav-inferior" id="nav-inferior"></nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
</div>

<script>
/* ===================================================================
   CONFIGURAÇÃO
=================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbzqcoUP0WltvaT6wzg7l8ZDNJsTai5nButUWu6tt9h5J25HGDRt-NkiqIjUmtu35xg5/exec";

let usuarioSalvo = null;
try { usuarioSalvo = JSON.parse(localStorage.getItem('lav_usuario') || 'null'); } catch (e) {}

const ESTADO = {
  token: localStorage.getItem('lav_token') || null,
  usuario: usuarioSalvo,
  telaAtual: 'dashboard',
  dashboardMes: dataLocalISO().slice(0, 7),
  cache: { clientes: [], produtos: [], producao: [], financeiro: [], clientesPainel: [] }
};

/* ===================================================================
   API
=================================================================== */
async function api(action, params = {}) {
  const corpo = Object.assign({ action, token: ESTADO.token }, params);
  let resp;
  try {
    resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(corpo)
    });
  } catch (err) {
    throw new Error('Não foi possível conectar ao servidor. Verifique a publicação do Web App e sua internet.');
  }

  const texto = await resp.text();
  let json;
  try { json = JSON.parse(texto); } catch (err) {
    throw new Error('O servidor retornou uma resposta inválida. Reimplante o Web App e tente novamente.');
  }
  if (!resp.ok) throw new Error('Servidor indisponível (HTTP ' + resp.status + ')');
  if (!json.ok) {
    const mensagem = json.erro || 'Erro desconhecido';
    if (/sessão inválida|sessão expirada/i.test(mensagem)) limparSessaoLocal();
    throw new Error(mensagem);
  }
  return json.dados;
}

/* ===================================================================
   UI HELPERS
=================================================================== */
function toast(msg, tipo) {
  const el = document.createElement('div');
  el.className = 'toast';
  if (tipo === 'erro') el.style.background = 'var(--danger)';
  el.textContent = msg;
  document.getElementById('toast-root').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function iniciais(nome) {
  return (nome || '?').trim().split(' ').slice(0,2).map(p => p[0]).join('').toUpperCase();
}

function formatarMoeda(v) {
  return Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function dataLocalISO(data = new Date()) {
  const dt = new Date(data);
  const ano = dt.getFullYear();
  const mes = String(dt.getMonth() + 1).padStart(2, '0');
  const dia = String(dt.getDate()).padStart(2, '0');
  return `${ano}-${mes}-${dia}`;
}

function formatarData(d) {
  if (!d) return '—';
  const dt = new Date(/^\d{4}-\d{2}-\d{2}$/.test(String(d)) ? String(d) + 'T12:00:00' : d);
  if (isNaN(dt)) return '—';
  return dt.toLocaleDateString('pt-BR');
}

function esc(valor) {
  return String(valor ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function escAttr(valor) { return esc(valor); }

function linkWhats(numero, msg) {
  const limpo = String(numero || '').replace(/\D/g, '');
  const texto = encodeURIComponent(msg || '');
  return `https://wa.me/55${limpo}?text=${texto}`;
}

function fecharModal() { document.getElementById('modal-root').innerHTML = ''; }

function abrirModal(titulo, htmlConteudo, opts = {}) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-fundo ${opts.centro ? 'centro' : ''}" id="modal-fundo-el">
      <div class="modal-caixa">
        <div class="modal-cabecalho">
          <h2>${titulo}</h2>
          <button class="fechar-x" onclick="fecharModal()">✕</button>
        </div>
        ${htmlConteudo}
      </div>
    </div>`;
  document.getElementById('modal-fundo-el').addEventListener('click', (e) => {
    if (e.target.id === 'modal-fundo-el') fecharModal();
  });
}

/* ===================================================================
   LOGIN / SESSÃO
=================================================================== */
function mostrarRecuperar() {
  document.getElementById('login-passo-entrar').classList.add('hidden');
  document.getElementById('login-passo-recuperar').classList.remove('hidden');
}
function mostrarEntrar() {
  document.getElementById('login-passo-recuperar').classList.add('hidden');
  document.getElementById('login-passo-entrar').classList.remove('hidden');
}

document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const erroBox = document.getElementById('login-erro');
  erroBox.classList.add('hidden');
  const btn = document.getElementById('btn-entrar');
  btn.textContent = 'Entrando...'; btn.disabled = true;
  try {
    const email = document.getElementById('login-email').value.trim();
    const senha = document.getElementById('login-senha').value;
    const dados = await api('login', { email, senha });
    ESTADO.token = dados.token;
    ESTADO.usuario = { nome: dados.nome, perfil: dados.perfil, email: dados.email };
    localStorage.setItem('lav_token', ESTADO.token);
    localStorage.setItem('lav_usuario', JSON.stringify(ESTADO.usuario));
    entrarNoApp();
  } catch (err) {
    erroBox.textContent = err.message;
    erroBox.classList.remove('hidden');
  } finally {
    btn.textContent = 'Entrar'; btn.disabled = false;
  }
});

document.getElementById('form-recuperar').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msgBox = document.getElementById('recuperar-msg');
  try {
    const email = document.getElementById('recuperar-email').value.trim();
    await api('recuperarSenha', { email });
    msgBox.className = 'ok-msg';
    msgBox.textContent = 'Nova senha enviada para o seu e-mail.';

        <div class="lbl">Peças · ${STATUS_LABEL[s]}</div>
      </div>`).join('');

          <button class="btn pequeno" onclick="abrirDetalheCliente(${c.ID_Cliente})">Detalhes</button>
        </div>
      </div>`;
    }).join('') || '<div class="vazio"><p>Nenhum cliente cadastrado.</p></div>';
    const financeiroHtml = `<div class="eyebrow" style="margin:18px 0 10px;">Financeiro de ${esc(ESTADO.dashboardMes)}</div>
      <div class="grid-stats"><div class="stat-card"><div class="num" style="color:var(--success)">${formatarMoeda(d.financeiroMes.receitas)}</div><div class="lbl">Receitas</div></div><div class="stat-card"><div class="num" style="color:var(--danger)">${formatarMoeda(d.financeiroMes.despesas)}</div><div class="lbl">Despesas</div></div></div>
      <div class="cartao" style="text-align:center;"><div class="meta">Saldo do mês</div><div style="font-family:var(--font-display);font-size:24px;font-weight:600;color:${d.financeiroMes.saldo >= 0 ? 'var(--primary-dark)' : 'var(--danger)'}">${formatarMoeda(d.financeiroMes.saldo)}</div></div>`;
    conteudo(`<div class="sem-impressao" style="display:flex;justify-content:flex-end;margin-bottom:10px;"><button class="btn secundario" onclick="exportarPainelPdf()">Exportar painel em PDF</button></div><div class="relatorio-cabecalho"><h1 style="font-family:var(--font-display);font-size:24px;margin:0 0 4px;">Relatório da lavanderia</h1><div class="meta">Competência ${esc(ESTADO.dashboardMes)} · Gerado em ${esc(formatarData(new Date()))}</div></div><div class="dashboard-filtros"><label class="eyebrow">Competência</label><select id="dashboard-mes">${meses}</select></div>
      <div class="eyebrow" style="margin-bottom:10px;">Produção · ${esc(d.pedidosEmAberto)} pedido(s) em aberto</div>

function renderTabelaComparacaoDespesas_(grupos) {
  if (!grupos.length) return '<div class="vazio"><p>Nenhuma compra encontrada para este filtro.</p></div>';
  return `<div class="tabela-scroll"><table><thead><tr><th>Produto/categoria</th><th>Últimos preços unitários</th><th>Média</th><th>Última compra</th></tr></thead><tbody>${grupos.map(g => `<tr><td><strong>${esc(g.nome)}</strong></td><td>${g.lancamentos.map(l => `<span title="${escAttr(l.descricao)}">${formatarMoeda(l.precoUnitario)}/${esc(l.unidade)}</span>`).join(' · ')}</td><td>${formatarMoeda(g.mediaUnitario)}</td><td>${g.ultimaCompra ? formatarData(g.ultimaCompra.data) : '—'}</td></tr>`).join('')}</tbody></table></div>`;
}

function renderComparacaoDespesas_(grupos) {
  if (!grupos.length) return '<div class="vazio"><p>Nenhuma despesa registrada para comparar.</p></div>';
  ESTADO.cache.analiseDespesas = grupos;
  return `<div class="cartao"><div class="campo"><label>Filtrar produto ou categoria</label><select id="filtro-despesas"><option value="">Todas as despesas</option>${grupos.map(g => `<option value="${escAttr(g.nome)}">${esc(g.nome)}</option>`).join('')}</select></div><div id="tabela-comparacao-despesas">${renderTabelaComparacaoDespesas_(grupos)}</div></div>`;
}

function filtrarComparacaoDespesas(nome) {
  const alvo = document.getElementById('tabela-comparacao-despesas');
  if (!alvo) return;
  const grupos = ESTADO.cache.analiseDespesas || [];
  alvo.innerHTML = renderTabelaComparacaoDespesas_(nome ? grupos.filter(g => g.nome === nome) : grupos);
}

function exportarPainelPdf() {
  const tituloOriginal = document.title;
  document.title = 'Relatorio_Lavanderia_' + (ESTADO.dashboardMes || dataLocalISO().slice(0, 7));

  setTimeout(() => { document.title = tituloOriginal; }, 1000);
}

async function telaClientes(termo) {
  carregando();
  try {
    const lista = await api('listarClientes', termo ? { busca: termo } : {});
    ESTADO.cache.clientes = lista;
    conteudo(`
      <div class="busca-wrap">
        <input id="busca-clientes" placeholder="Buscar por nome ou WhatsApp" value="${escAttr(termo || '')}">
      </div>
      <div id="lista-clientes">${renderListaClientes(lista)}</div>
    `);
    const inputBusca = document.getElementById('busca-clientes');
    let t;
    inputBusca.addEventListener('input', () => {
      clearTimeout(t);
      t = setTimeout(() => telaClientes(inputBusca.value), 350);
    });
    document.getElementById('conteudo').insertAdjacentHTML('beforeend', `<button class="fab" onclick="abrirNovoCliente()">+</button>`);
  } catch (err) { conteudo(`<div class="vazio"><h3>Erro</h3><p>${err.message}</p></div>`); }

function renderListaClientes(lista) {
  if (!lista.length) return `<div class="vazio"><h3>Nenhum cliente ainda</h3><p>Toque em "+" para cadastrar o primeiro.</p></div>`;
  return lista.map(c => `
    <div class="cartao" onclick="abrirDetalheCliente(${c.ID_Cliente})">
      <div class="cartao-linha"><div><h3>${esc(c.Nome)}</h3><div class="meta">${esc(c.WhatsApp || 'sem WhatsApp')} · ${esc(c.Email || 'sem e-mail')}</div></div><span class="badge ${statusPlanoClasse(c.Status_Plano)}">${esc(c.Status_Plano || 'Inativo')}</span></div>
      <div class="item-linha" style="margin-top:8px;"><span class="k">Saldo disponível</span><span class="v">${esc(c.Saldo_Disponivel)} peças</span></div>
      <div class="item-linha"><span class="k">Em produção</span><span class="v">${esc(c.Saldo_Em_Producao)} peças</span></div>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;" onclick="event.stopPropagation()">
        <button class="btn pequeno" onclick="abrirDetalheCliente(${c.ID_Cliente})">Editar</button>
        <button class="btn pequeno secundario" onclick="abrirHistoricoCliente(${c.ID_Cliente})">Histórico</button>
        ${c.WhatsApp ? `<a class="btn pequeno secundario" href="${linkWhats(c.WhatsApp, 'Olá ' + c.Nome + '! Tudo bem?')}" target="_blank">WhatsApp</a>` : ''}
      </div>
    </div>`).join('');
}

function statusPlanoClasse(status) {
  const map = { 'Pago': 'retirado', 'A vencer': 'recebido', 'Atrasado': 'cancelado', 'Inativo': 'passagem' };
  return map[status] || 'passagem';
}

async function abrirDetalheCliente(id) {
  const c = ESTADO.cache.clientes.find(x => String(x.ID_Cliente) === String(id));
  if (!c) return;
  let produtosOpts = '<option value="">— nenhum —</option>';
  try {
    const produtos = await api('listarProdutos');
    ESTADO.cache.produtos = produtos;
    produtosOpts += produtos.map(p => `<option value="${escAttr(p.ID_Produto)}" ${String(c.ID_Produto_Plano) === String(p.ID_Produto) ? 'selected' : ''}>${esc(p.Nome)} (${esc(p.Qtd_Pecas)} pçs)</option>`).join('');
  } catch (e) {}
  const status = ['Pago', 'A vencer', 'Atrasado', 'Inativo'];
  abrirModal(esc(c.Nome), `
    <form id="form-editar-cliente">
      <div class="campo"><label>Nome</label><input id="ec-nome" required value="${escAttr(c.Nome)}"></div>
      <div class="campo"><label>WhatsApp</label><input id="ec-whats" required value="${escAttr(c.WhatsApp || '')}"></div>
      <div class="campo"><label>E-mail</label><input type="email" id="ec-email" value="${escAttr(c.Email || '')}"></div>
      <div class="campo"><label>Status do plano</label><select id="ec-status">${status.map(s => `<option value="${escAttr(s)}" ${c.Status_Plano === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></div>
      <div class="campo"><label>Observações</label><textarea id="ec-obs" rows="2">${esc(c.Observacoes || '')}</textarea></div>
      <button class="btn" type="submit">Salvar dados do cliente</button>
    </form>
    <div style="display:flex;gap:8px;margin-top:10px;"><button class="btn secundario" type="button" onclick="abrirHistoricoCliente(${c.ID_Cliente})">Histórico de pagamentos e peças</button>${c.WhatsApp ? `<a class="btn secundario" href="${linkWhats(c.WhatsApp, 'Olá ' + c.Nome + '! Tudo bem?')}" target="_blank">WhatsApp</a>` : ''}</div>
    <hr style="border:none;border-top:1px solid var(--line);margin:18px 0;">
    <div class="eyebrow" style="margin-bottom:10px;">Renovar / recarregar pacote</div>
    <form id="form-recarga">
      <div class="campo"><label>Plano/produto</label><select id="rec-produto">${produtosOpts}</select></div>
      <div class="campo"><label>Peças a adicionar</label><input type="number" id="rec-pecas" min="1" required></div>
      <button class="btn" type="submit">Aplicar recarga</button>
    </form>`);
  document.getElementById('form-editar-cliente').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      await api('editarCliente', { idCliente: c.ID_Cliente, Nome: document.getElementById('ec-nome').value, WhatsApp: document.getElementById('ec-whats').value, Email: document.getElementById('ec-email').value, Status_Plano: document.getElementById('ec-status').value, Observacoes: document.getElementById('ec-obs').value });
      toast('Cliente atualizado'); fecharModal(); telaClientes();
    } catch (err) { toast(err.message, 'erro'); }
  });
  document.getElementById('form-recarga').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      await api('editarCliente', { idCliente: c.ID_Cliente, idProdutoPlano: document.getElementById('rec-produto').value, recargaPecas: Number(document.getElementById('rec-pecas').value) });
      toast('Pacote recarregado'); fecharModal(); telaClientes();
    } catch (err) { toast(err.message, 'erro'); }
  });

function renderListaProducao(lista) {
  if (!lista.length) return `<div class="vazio"><h3>Nenhum pedido aqui</h3><p>Toque em "+" para registrar um novo pedido.</p></div>`;
  const ordem = ['Recebido', 'Em_Lavagem', 'Em_Passagem', 'Pronto', 'Retirado'];
  const rotulos = { Recebido: 'Recebido', Em_Lavagem: 'Lavagem', Em_Passagem: 'Passagem', Pronto: 'Pronto', Retirado: 'Retirado' };
  return lista.slice().reverse().map(p => {
    const idxAtual = ordem.indexOf(p.Status);
    const varal = ordem.map((s, i) => `
      <div class="varal-pino ${i < idxAtual ? 'concluido' : ''} ${i === idxAtual ? 'atual' : ''}">
        <span class="varal-peca"></span><span class="varal-rotulo">${rotulos[s]}</span>
      </div>`).join('');
    const classeBadge = p.Status.toLowerCase().replace('em_', '');
    return `
      <div class="cartao">
        <div class="cartao-linha">
          <div><h3>#${esc(p.ID_Pedido)} · ${esc(p.Nome_Cliente)}</h3><div class="meta">${esc(p.Qtd_Pecas)} peças · ${p.Origem === 'AVULSO' ? 'Avulso' : 'Plano'}</div></div>
          <span class="badge ${p.Status === 'Cancelado' ? 'cancelado' : classeBadge}">${p.Status === 'Cancelado' ? 'Cancelado' : rotulos[p.Status]}</span>
        </div>
        ${p.Status !== 'Cancelado' ? `<div class="varal"><div class="varal-corda"></div><div class="varal-etapas">${varal}</div></div>` : ''}
        <div class="linha-datas"><span>Recebido: ${formatarData(p.Data_Recebido)}</span><span>Lavagem: ${formatarData(p.Data_Em_Lavagem)}</span><span>Passagem: ${formatarData(p.Data_Em_Passagem)}</span><span>Pronto: ${formatarData(p.Data_Pronto)}</span><span>Retirado: ${formatarData(p.Data_Retirado)}</span><span>Registro: ${formatarData(p.Data_Registro)}</span></div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
          ${p.Status !== 'Cancelado' ? `<button class="btn pequeno secundario" onclick="abrirEditarPedido(${p.ID_Pedido})">Editar lançamento</button>` : ''}
          ${p.Status !== 'Retirado' && p.Status !== 'Cancelado' ? `${idxAtual < ordem.length - 1 ? `<button class="btn pequeno" onclick="avancarStatus(${p.ID_Pedido}, '${ordem[idxAtual+1]}')">Avançar → ${rotulos[ordem[idxAtual+1]]}</button>` : ''}<button class="btn pequeno secundario" onclick="cancelarPedido(${p.ID_Pedido})">Cancelar</button>` : ''}
        </div>
      </div>`;
  }).join('');
}

async function avancarStatus(id, novoStatus) {

async function carregarClientesOpts_(selecionado) {

async function telaProdutos(filtro) {
  carregando();
  try {
    const lista = await api('listarProdutos');
    ESTADO.cache.produtos = lista;
    const filtroAtual = filtro || 'TODOS';
    const filtrada = filtroAtual === 'TODOS' ? lista : lista.filter(p => filtroAtual === 'DESPESA' ? p.Tipo === 'DESPESA' : p.Tipo !== 'DESPESA');
    conteudo(`<div class="filtros-chip"><button class="chip ${filtroAtual === 'TODOS' ? 'ativo' : ''}" onclick="telaProdutos('TODOS')">Todos</button><button class="chip ${filtroAtual === 'PLANO' ? 'ativo' : ''}" onclick="telaProdutos('PLANO')">Planos e avulsos</button><button class="chip ${filtroAtual === 'DESPESA' ? 'ativo' : ''}" onclick="telaProdutos('DESPESA')">Produtos de despesa</button></div><div class="eyebrow" style="margin:16px 0 10px;">${filtroAtual === 'DESPESA' ? 'Catálogo de despesas' : 'Planos, pacotes e serviços'}</div><div id="lista-produtos">${renderListaProdutos(filtrada)}</div>`);
    document.getElementById('conteudo').insertAdjacentHTML('beforeend', `<button class="fab" onclick="abrirNovoProduto()">+</button>`);
  } catch (err) { conteudo(`<div class="vazio"><h3>Erro</h3><p>${esc(err.message)}</p></div>`); }
}

function renderListaProdutos(lista) {
  if (!lista.length) return `<div class="vazio"><h3>Nenhum item cadastrado</h3><p>Cadastre um plano ou um produto comprado para despesas.</p></div>`;
  return lista.map(p => `
    <div class="cartao" onclick="abrirEditarProduto(${p.ID_Produto})">
      <div class="cartao-linha">
        <div><h3>${esc(p.Nome)}</h3><div class="meta">${p.Tipo === 'DESPESA' ? 'Despesa · ' + esc(p.Categoria_Despesa || 'Outros') + ' · ' + esc(p.Unidade || 'un') : (p.Tipo === 'PACOTE' ? esc(p.Qtd_Pecas) + ' peças' : 'Serviço avulso')} ${p.Promocao ? '· ' + esc(p.Promocao) : ''}</div></div>
        <div style="font-family:var(--font-display);font-weight:600;font-size:16px;">${formatarMoeda(p.Preco)}${p.Tipo === 'DESPESA' ? '<div class="meta">preço padrão</div>' : ''}</div>
      </div>
    </div>`).join('');
}

function formularioProduto(p) {
  const tipo = p?.Tipo || 'PACOTE';
  const despesa = tipo === 'DESPESA';
  return `<form id="form-produto">
    <div class="campo"><label>Nome</label><input id="pr-nome" required value="${escAttr(p?.Nome || '')}" placeholder="Ex: Plano mensal 30 peças ou Sabão em pó 5 kg"></div>
    <div class="linha-2"><div class="campo"><label>Tipo</label><select id="pr-tipo"><option value="PACOTE" ${tipo === 'PACOTE' ? 'selected' : ''}>Plano / pacote</option><option value="AVULSO" ${tipo === 'AVULSO' ? 'selected' : ''}>Serviço avulso</option><option value="DESPESA" ${tipo === 'DESPESA' ? 'selected' : ''}>Produto de despesa</option></select></div><div class="campo" id="pr-qtd-wrap"><label>Qtd. peças</label><input type="number" id="pr-qtd" min="1" value="${p?.Qtd_Pecas || 1}"></div></div>
    <div class="linha-2"><div class="campo"><label>Preço padrão (R$)</label><input type="number" step="0.01" id="pr-preco" required value="${p?.Preco || ''}"></div><div class="campo" id="pr-unidade-wrap"><label>Unidade</label><input id="pr-unidade" value="${escAttr(p?.Unidade || (despesa ? 'un' : 'peças'))}" placeholder="kg, caixa, un"></div></div>
    <div class="campo" id="pr-cat-wrap"><label>Categoria da despesa</label><input id="pr-categoria" value="${escAttr(p?.Categoria_Despesa || '')}" placeholder="Ex: Sabão em pó"></div>
    <div class="campo"><label>Observação / promoção</label><input id="pr-promo" value="${escAttr(p?.Promocao || '')}" placeholder="Opcional"></div>
    <button class="btn" type="submit">${p ? 'Salvar alterações' : 'Cadastrar item'}</button></form>`;
}

function ajustarFormularioProduto_() {
  const despesa = document.getElementById('pr-tipo').value === 'DESPESA';
  document.getElementById('pr-qtd-wrap').classList.toggle('hidden', despesa);
  document.getElementById('pr-cat-wrap').classList.toggle('hidden', !despesa);
}

function abrirNovoProduto() {
  abrirModal('Novo plano ou produto de despesa', formularioProduto());
  ajustarFormularioProduto_();
  document.getElementById('pr-tipo').addEventListener('change', ajustarFormularioProduto_);
  document.getElementById('form-produto').addEventListener('submit', async (e) => {
    e.preventDefault();
    try { await api('cadastrarProduto', { nome: document.getElementById('pr-nome').value, tipo: document.getElementById('pr-tipo').value, qtdPecas: document.getElementById('pr-qtd').value, preco: document.getElementById('pr-preco').value, promocao: document.getElementById('pr-promo').value, unidade: document.getElementById('pr-unidade').value, categoriaDespesa: document.getElementById('pr-categoria').value }); toast('Cadastro salvo'); fecharModal(); telaProdutos(); } catch (err) { toast(err.message, 'erro'); }
  });
}

function abrirEditarProduto(id) {
  const p = ESTADO.cache.produtos.find(x => String(x.ID_Produto) === String(id));
  if (!p) return;
  abrirModal('Editar cadastro', formularioProduto(p));
  ajustarFormularioProduto_();
  document.getElementById('pr-tipo').addEventListener('change', ajustarFormularioProduto_);
  document.getElementById('form-produto').addEventListener('submit', async (e) => {
    e.preventDefault();
    try { await api('editarProduto', { idProduto: id, Nome: document.getElementById('pr-nome').value, Tipo: document.getElementById('pr-tipo').value, Qtd_Pecas: document.getElementById('pr-qtd').value, Preco: document.getElementById('pr-preco').value, Promocao: document.getElementById('pr-promo').value, Unidade: document.getElementById('pr-unidade').value, Categoria_Despesa: document.getElementById('pr-categoria').value }); toast('Cadastro atualizado'); fecharModal(); telaProdutos(); } catch (err) { toast(err.message, 'erro'); }
  });
}

/* ===================================================================
   FINANCEIRO (somente Dono)
=================================================================== */
let financeiroFiltro = '';
let financeiroMesAtual = dataLocalISO().slice(0, 7);
async function telaFinanceiro(tipo, mes) {
  financeiroFiltro = tipo !== undefined ? tipo : financeiroFiltro;
  financeiroMesAtual = mes || financeiroMesAtual;
  carregando();
  try {
    const meses = await api('mesesDisponiveis');
    const lista = await api('listarFinanceiro', Object.assign({ mes: financeiroMesAtual }, financeiroFiltro ? { tipo: financeiroFiltro } : {}));
    ESTADO.cache.financeiro = lista;
    const receitas = lista.filter(l => l.Tipo === 'RECEITA').reduce((a,l) => a + Number(l.Valor), 0);
    const despesas = lista.filter(l => l.Tipo === 'DESPESA').reduce((a,l) => a + Number(l.Valor), 0);
    const mesOpts = meses.map(m => `<option value="${escAttr(m)}" ${m === financeiroMesAtual ? 'selected' : ''}>${esc(m)}</option>`).join('');
    conteudo(`<div class="dashboard-filtros"><label class="eyebrow">Competência</label><select id="financeiro-mes">${mesOpts}</select></div><div class="grid-stats"><div class="stat-card"><div class="num" style="color:var(--success)">${formatarMoeda(receitas)}</div><div class="lbl">Receitas de ${esc(financeiroMesAtual)}</div></div><div class="stat-card"><div class="num" style="color:var(--danger)">${formatarMoeda(despesas)}</div><div class="lbl">Despesas de ${esc(financeiroMesAtual)}</div></div></div><div class="tabs-topo"><button class="tab-topo ${financeiroFiltro === '' ? 'ativo' : ''}" onclick="telaFinanceiro('', financeiroMesAtual)">Tudo</button><button class="tab-topo ${financeiroFiltro === 'RECEITA' ? 'ativo' : ''}" onclick="telaFinanceiro('RECEITA', financeiroMesAtual)">Receitas</button><button class="tab-topo ${financeiroFiltro === 'DESPESA' ? 'ativo' : ''}" onclick="telaFinanceiro('DESPESA', financeiroMesAtual)">Despesas</button></div><div id="lista-financeiro">${renderListaFinanceiro(lista)}</div>`);
    document.getElementById('financeiro-mes').addEventListener('change', e => telaFinanceiro(financeiroFiltro, e.target.value));
    document.getElementById('conteudo').insertAdjacentHTML('beforeend', `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;"><button class="btn" onclick="abrirNovaReceita()">+ Receita de cliente</button><button class="btn secundario" onclick="abrirNovaDespesa()">+ Despesa</button></div>`);
  } catch (err) { conteudo(`<div class="vazio"><h3>Erro</h3><p>${esc(err.message)}</p></div>`); }
}

function renderListaFinanceiro(lista) {
  if (!lista.length) return `<div class="vazio"><h3>Nada lançado neste mês</h3><p>Use os botões para registrar uma receita de cliente ou uma despesa.</p></div>`;
  return lista.slice().reverse().map(l => `<div class="cartao cartao-linha" onclick="abrirEditarLancamento(${l.ID_Lancamento})"><div><h3>${esc(l.Descricao)}</h3><div class="meta">${esc(l.Categoria)} ${l.Fornecedor ? '· ' + esc(l.Fornecedor) : ''} · ${formatarData(l.Data)}${l.ID_Cliente_Relacionado ? ' · Cliente #' + esc(l.ID_Cliente_Relacionado) : ''}</div>${Number(l.Quantidade) ? `<div class="meta">${esc(l.Quantidade)} ${esc(l.Unidade || 'un')} · ${formatarMoeda(l.Preco_Unitario || (Number(l.Valor) / Number(l.Quantidade)))} por unidade</div>` : ''}${Number(l.Qtd_Pecas_Liberadas) ? `<div class="meta" style="color:var(--success)">+${esc(l.Qtd_Pecas_Liberadas)} peças liberadas</div>` : ''}</div><div style="font-family:var(--font-display);font-weight:600;color:${l.Tipo === 'RECEITA' ? 'var(--success)' : 'var(--danger)'}">${l.Tipo === 'RECEITA' ? '+' : '−'} ${formatarMoeda(l.Valor)}<div class="meta" style="text-align:right;">Editar</div></div></div>`).join('');
}

async function opcoesClientesProdutos_(clienteSelecionado, produtoSelecionado) {
  const clientes = ESTADO.cache.clientes.length ? ESTADO.cache.clientes : await api('listarClientes');
  const produtosTodos = ESTADO.cache.produtos.length ? ESTADO.cache.produtos : await api('listarProdutos');
  const produtos = produtosTodos.filter(p => p.Tipo !== 'DESPESA');
  ESTADO.cache.clientes = clientes; ESTADO.cache.produtos = produtosTodos;
  return { clientes: '<option value="">Selecione...</option>' + clientes.map(c => `<option value="${escAttr(c.ID_Cliente)}" ${String(c.ID_Cliente) === String(clienteSelecionado || '') ? 'selected' : ''}>${esc(c.Nome)} · saldo ${esc(c.Saldo_Disponivel)} peças</option>`).join(''), produtos: '<option value="">Sem plano específico</option>' + produtos.map(p => `<option value="${escAttr(p.ID_Produto)}" ${String(p.ID_Produto) === String(produtoSelecionado || '') ? 'selected' : ''}>${esc(p.Nome)} · ${esc(p.Qtd_Pecas)} peças · ${formatarMoeda(p.Preco)}</option>`).join('') };
}

function opcoesCategoriasDespesas_(selecionada) {
  const categorias = ['Sabão em pó','Sabão líquido','Amaciante','Alvejante','Água','Energia elétrica','Gás','Salários','Aluguel','Embalagens','Manutenção','Transporte','Impostos','Outros'];
  return '<option value="">Selecione...</option>' + categorias.map(c => `<option value="${escAttr(c)}" ${c === selecionada ? 'selected' : ''}>${esc(c)}</option>`).join('');
}

async function abrirNovaReceita() {
  try {
    const op = await opcoesClientesProdutos_();
    abrirModal('Receita de cliente', `<form id="form-receita-cliente"><div class="campo"><label>Cliente que pagou</label><select id="rc-cliente" required>${op.clientes}</select></div><div class="campo"><label>Plano/produto</label><select id="rc-produto">${op.produtos}</select></div><div class="linha-2"><div class="campo"><label>Valor de tabela (R$)</label><input type="number" step="0.01" id="rc-tabela" required></div><div class="campo"><label>Peças do plano</label><input type="number" min="1" id="rc-pecas" required></div></div><div class="linha-2"><div class="campo"><label>Desconto (%)</label><input type="number" min="0" max="99.99" step="0.01" id="rc-desconto-pct" value="0"></div><div class="campo"><label>Desconto (R$)</label><input type="number" min="0" step="0.01" id="rc-desconto-valor" value="0"></div></div><div class="campo"><label>Valor pago (R$)</label><input type="number" step="0.01" id="rc-valor" required></div><div class="campo"><label>Forma de pagamento</label><select id="rc-forma"><option>PIX</option><option>Dinheiro</option><option>Cartão</option><option>Transferência</option></select></div><div class="campo"><label>Data</label><input type="date" id="rc-data" value="${dataLocalISO()}"></div><div class="campo"><label>Descrição</label><input id="rc-desc" value="Pagamento de plano"></div><button class="btn" type="submit">Registrar pagamento e liberar peças</button></form>`);
    const produtoEl = document.getElementById('rc-produto');
    const tabelaEl = document.getElementById('rc-tabela');
    const pecasEl = document.getElementById('rc-pecas');
    const descontoPctEl = document.getElementById('rc-desconto-pct');
    const descontoValorEl = document.getElementById('rc-desconto-valor');
    const valorEl = document.getElementById('rc-valor');
    const preencherPlano = () => { const p = ESTADO.cache.produtos.find(x => String(x.ID_Produto) === String(produtoEl.value)); const tabela = p ? Number(p.Preco) || 0 : Number(tabelaEl.value) || 0; tabelaEl.value = tabela ? tabela.toFixed(2) : ''; if (p && Number(p.Qtd_Pecas)) pecasEl.value = p.Qtd_Pecas; const descontoPct = Number(descontoPctEl.value) || 0; const descontoValor = Number(descontoValorEl.value) || 0; const desconto = descontoPct > 0 ? tabela * descontoPct / 100 : descontoValor; valorEl.value = tabela ? Math.max(0, tabela - desconto).toFixed(2) : ''; if (p) document.getElementById('rc-desc').value = 'Pagamento de ' + p.Nome; };
    produtoEl.addEventListener('change', preencherPlano);
    descontoPctEl.addEventListener('input', () => { if (Number(descontoPctEl.value) > 0) descontoValorEl.value = '0'; preencherPlano(); });
    descontoValorEl.addEventListener('input', () => { if (Number(descontoValorEl.value) > 0) descontoPctEl.value = '0'; preencherPlano(); });
    preencherPlano();
    document.getElementById('form-receita-cliente').addEventListener('submit', async e => { e.preventDefault(); try { await api('lancarReceitaCliente', { idCliente: document.getElementById('rc-cliente').value, idProdutoPlano: produtoEl.value, valorTabela: tabelaEl.value, descontoPercentual: descontoPctEl.value, descontoValor: descontoValorEl.value, valor: valorEl.value, qtdPecas: pecasEl.value, formaPagamento: document.getElementById('rc-forma').value, data: document.getElementById('rc-data').value, descricao: document.getElementById('rc-desc').value }); toast('Receita registrada e saldo liberado'); fecharModal(); telaFinanceiro(financeiroFiltro, financeiroMesAtual); } catch (err) { toast(err.message, 'erro'); } });
  } catch (err) { toast(err.message, 'erro'); }
}

async function abrirNovaDespesa() {
  const produtosTodos = ESTADO.cache.produtos.length ? ESTADO.cache.produtos : await api('listarProdutos');
  ESTADO.cache.produtos = produtosTodos;
  const produtos = produtosTodos.filter(p => p.Tipo === 'DESPESA');
  const produtoOpts = '<option value="">Sem produto pré-cadastrado</option>' + produtos.map(p => `<option value="${escAttr(p.ID_Produto)}">${esc(p.Nome)} · ${formatarMoeda(p.Preco)}/${esc(p.Unidade || 'un')}</option>`).join('');
  abrirModal('Nova despesa', `<form id="form-despesa"><div class="campo"><label>Produto comprado (opcional)</label><select id="de-produto">${produtoOpts}</select></div><div class="campo"><label>Categoria</label><select id="de-cat">${opcoesCategoriasDespesas_()}</select></div><div class="campo hidden" id="de-outro-wrap"><label>Outra categoria</label><input id="de-outro" placeholder="Digite a categoria"></div><div class="campo"><label>Descrição</label><input id="de-desc" required placeholder="Ex: Sabão em pó 5 kg"></div><div class="linha-2"><div class="campo"><label>Quantidade</label><input type="number" step="0.01" min="0.01" id="de-qtd" required value="1"></div><div class="campo"><label>Unidade</label><input id="de-unidade" value="un" placeholder="kg, caixa, un"></div></div><div class="linha-2"><div class="campo"><label>Preço unitário (R$)</label><input type="number" step="0.01" min="0.01" id="de-unit" required></div><div class="campo"><label>Total (R$)</label><input type="number" step="0.01" id="de-valor" required></div></div><div class="campo"><label>Fornecedor</label><input id="de-fornecedor"></div><div class="campo"><label>Forma de pagamento</label><select id="de-forma"><option>Dinheiro</option><option>PIX</option><option>Cartão</option><option>Transferência</option></select></div><div class="campo"><label>Data</label><input type="date" id="de-data" value="${dataLocalISO()}"></div><button class="btn" type="submit">Registrar despesa</button></form>`);
  const produtoEl = document.getElementById('de-produto'); const catEl = document.getElementById('de-cat'); const outroWrap = document.getElementById('de-outro-wrap'); const qtdEl = document.getElementById('de-qtd'); const unitEl = document.getElementById('de-unit'); const totalEl = document.getElementById('de-valor');
  const recalcular = () => { totalEl.value = ((Number(qtdEl.value) || 0) * (Number(unitEl.value) || 0)).toFixed(2); };
  catEl.addEventListener('change', () => outroWrap.classList.toggle('hidden', catEl.value !== 'Outros'));
  produtoEl.addEventListener('change', () => { const p = produtos.find(x => String(x.ID_Produto) === String(produtoEl.value)); if (p) { document.getElementById('de-desc').value = p.Nome; catEl.value = p.Categoria_Despesa || 'Outros'; document.getElementById('de-unidade').value = p.Unidade || 'un'; unitEl.value = Number(p.Preco || 0).toFixed(2); outroWrap.classList.toggle('hidden', catEl.value !== 'Outros'); recalcular(); } });
  qtdEl.addEventListener('input', recalcular); unitEl.addEventListener('input', recalcular);
  document.getElementById('form-despesa').addEventListener('submit', async e => { e.preventDefault(); try { const categoria = catEl.value === 'Outros' ? document.getElementById('de-outro').value.trim() : catEl.value; await api('lancarFinanceiro', { tipo: 'DESPESA', idProdutoDespesa: produtoEl.value, descricao: document.getElementById('de-desc').value, categoria: categoria, quantidade: qtdEl.value, unidade: document.getElementById('de-unidade').value, precoUnitario: unitEl.value, valor: totalEl.value, fornecedor: document.getElementById('de-fornecedor').value, formaPagamento: document.getElementById('de-forma').value, data: document.getElementById('de-data').value }); toast('Despesa registrada'); fecharModal(); telaFinanceiro(financeiroFiltro, financeiroMesAtual); } catch (err) { toast(err.message, 'erro'); } });
}

function abrirEditarLancamento(id) {
  const l = ESTADO.cache.financeiro.find(x => String(x.ID_Lancamento) === String(id));
  if (!l) return;
  const produtos = (ESTADO.cache.produtos || []).filter(p => p.Tipo === 'DESPESA');
  const produtoOpts = '<option value="">Sem produto</option>' + produtos.map(p => `<option value="${escAttr(p.ID_Produto)}" ${String(p.ID_Produto) === String(l.ID_Produto_Despesa || '') ? 'selected' : ''}>${esc(p.Nome)}</option>`).join('');
  abrirModal('Editar lançamento', `<form id="form-editar-lancamento"><div class="campo"><label>Tipo</label><select id="el-tipo"><option value="RECEITA" ${l.Tipo === 'RECEITA' ? 'selected' : ''}>Receita</option><option value="DESPESA" ${l.Tipo === 'DESPESA' ? 'selected' : ''}>Despesa</option></select></div><div class="campo"><label>Produto de despesa</label><select id="el-produto">${produtoOpts}</select></div><div class="campo"><label>Descrição</label><input id="el-desc" required value="${escAttr(l.Descricao)}"></div><div class="linha-2"><div class="campo"><label>Categoria</label><input id="el-cat" value="${escAttr(l.Categoria || '')}"></div><div class="campo"><label>Fornecedor</label><input id="el-fornecedor" value="${escAttr(l.Fornecedor || '')}"></div></div><div class="linha-2"><div class="campo"><label>Quantidade</label><input type="number" step="0.01" min="0.01" id="el-qtd" value="${escAttr(l.Quantidade || 1)}"></div><div class="campo"><label>Unidade</label><input id="el-unidade" value="${escAttr(l.Unidade || 'un')}"></div></div><div class="linha-2"><div class="campo"><label>Preço unitário</label><input type="number" step="0.01" id="el-unit" value="${escAttr(l.Preco_Unitario || l.Valor || '')}"></div><div class="campo"><label>Total</label><input type="number" step="0.01" id="el-valor" required value="${escAttr(l.Valor)}"></div></div><div class="campo"><label>Forma de pagamento</label><input id="el-forma" value="${escAttr(l.Forma_Pagamento || '')}"></div><div class="campo"><label>Data</label><input type="date" id="el-data" value="${dataLocalISO(l.Data)}"></div>${l.Tipo === 'RECEITA' ? `<div class="campo"><label>ID do cliente</label><input id="el-cliente" value="${escAttr(l.ID_Cliente_Relacionado || '')}"></div><div class="campo"><label>Peças liberadas nesta receita</label><input type="number" min="0" id="el-pecas" value="${escAttr(l.Qtd_Pecas_Liberadas || 0)}"></div>` : ''}<button class="btn" type="submit">Salvar lançamento</button></form>`);
  const qtdEl = document.getElementById('el-qtd'); const unitEl = document.getElementById('el-unit'); const valorEl = document.getElementById('el-valor');
  const recalc = () => { if (l.Tipo === 'DESPESA') valorEl.value = ((Number(qtdEl.value) || 0) * (Number(unitEl.value) || 0)).toFixed(2); };
  qtdEl.addEventListener('input', recalc); unitEl.addEventListener('input', recalc);
  document.getElementById('form-editar-lancamento').addEventListener('submit', async e => { e.preventDefault(); try { await api('editarFinanceiro', { idLancamento: id, tipo: document.getElementById('el-tipo').value, descricao: document.getElementById('el-desc').value, categoria: document.getElementById('el-cat').value, valor: document.getElementById('el-valor').value, fornecedor: document.getElementById('el-fornecedor').value, formaPagamento: document.getElementById('el-forma').value, data: document.getElementById('el-data').value, idCliente: document.getElementById('el-cliente')?.value || '', qtdPecas: document.getElementById('el-pecas')?.value || 0, quantidade: document.getElementById('el-qtd').value, unidade: document.getElementById('el-unidade').value, precoUnitario: document.getElementById('el-unit').value, idProdutoDespesa: document.getElementById('el-produto').value }); toast('Lançamento atualizado'); fecharModal(); telaFinanceiro(financeiroFiltro, financeiroMesAtual); } catch (err) { toast(err.message, 'erro'); } });
}

/* ===================================================================
   BOOT
=================================================================== */
async function boot() {
  if (!ESTADO.token || !ESTADO.usuario) return;
  try {
    // Valida o token antes de exibir o painel; evita tela quebrada por sessão expirada.
    await api('dashboard');
    entrarNoApp();
  } catch (err) {
    limparSessaoLocal();
    const erroBox = document.getElementById('login-erro');
    erroBox.textContent = 'Sua sessão expirou. Entre novamente.';
    erroBox.classList.remove('hidden');
  }
}
boot();
</script>
</body>
</html>
