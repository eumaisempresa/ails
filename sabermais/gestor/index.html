<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Gestor AILS⁺</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;700&display=swap'  );
        :root { --fundo: #060E18; --card: #0A1624; --dourado: #C4974A; --bordas: rgba(196, 151, 74, 0.2); }
        body { background: var(--fundo); color: #EEF0F2; font-family: 'DM Sans', sans-serif; padding: 40px; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid var(--bordas); padding-bottom: 20px; }
        .card { background: var(--card); border: 1px solid var(--bordas); padding: 25px; border-radius: 8px; margin-bottom: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid var(--bordas); font-size: 13px; }
        th { color: var(--dourado); text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
        .btn-acao { padding: 6px 12px; background: transparent; border: 1px solid var(--dourado); color: var(--dourado); cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 10px; margin-bottom: 5px; display: block; width: 100%; text-align: center; text-decoration: none; }
        .btn-acao:hover { background: var(--dourado); color: #000; }
        .btn-wa { border-color: #25D366; color: #25D366; }
        .btn-wa:hover { background: #25D366; color: #fff; }
        .tag-curso { display: inline-block; padding: 2px 8px; background: rgba(196, 151, 74, 0.1); border: 1px solid var(--dourado); border-radius: 10px; font-size: 10px; margin: 2px; color: #fff; }
        .tag-oferta { border-color: #7A8FA3; color: #7A8FA3; opacity: 0.7; }
        #authOverlay { position: fixed; inset: 0; background: var(--fundo); display: flex; justify-content: center; align-items: center; z-index: 999; }
        input, select { background: #0E1E30; border: 1px solid var(--bordas); color: #fff; padding: 10px; border-radius: 4px; outline: none; width: 100%; }
    </style>
</head>
<body>
    <div id="authOverlay">
        <div class="card" style="width: 350px; text-align: center;">
            <h2 style="color: var(--dourado); font-family: 'Cormorant Garamond'; margin-bottom: 20px;">Acesso Console AILS⁺</h2>
            <input type="password" id="masterPass" placeholder="Senha Master" style="margin-bottom: 20px;">
            <button onclick="autenticarGestor()" class="btn-acao" style="padding: 15px; font-size: 14px;">Entrar no Console</button>
        </div>
    </div>

    <div class="header">
        <h1 style="font-family: 'Cormorant Garamond'; color: var(--dourado);">Console Central AILS⁺</h1>
        <div id="stats">Ambientes Ativos: <span id="countAmbientes" style="color: var(--dourado); font-weight: bold;">0</span></div>
    </div>

    <div class="card">
        <h3>Gestão de Clientes e Ofertas</h3>
        <table id="tabelaAlunos">
            <thead>
                <tr>
                    <th width="20%">Aluno / Empresa</th>
                    <th width="15%">Contato</th>
                    <th width="25%">Cursos Adquiridos</th>
                    <th width="20%">Sugestão de Oferta</th>
                    <th width="20%">Ações de CRM</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwEwvmfIS7cWhkh35Mi8mRNGaVpbz-9wJWZYS6QOa9cmudlRemNvCXfq0iHAR-tD1yE/exec";
        let dbAlunos = [];

        function autenticarGestor( ) {
            const pass = document.getElementById('masterPass').value;
            fetch(`${SCRIPT_URL}?action=validarAdmin&senha=${encodeURIComponent(pass)}`)
                .then(r => r.json()).then(res => {
                    if(res.autorizado) { document.getElementById('authOverlay').style.display = 'none'; carregarDados(); } 
                    else { alert("Senha incorreta!"); }
                });
        }

        function carregarDados() {
            fetch(`${SCRIPT_URL}?action=carregarPainelGestor`)
                .then(r => r.json()).then(res => {
                    if(res.success) {
                        dbAlunos = res.data.alunos;
                        const tbody = document.querySelector('#tabelaAlunos tbody');
                        tbody.innerHTML = "";
                        document.getElementById('countAmbientes').innerText = dbAlunos.length;
                        
                        dbAlunos.forEach((aluno, index) => {
                            const tr = document.createElement('tr');
                            const tagsComprados = aluno.cursosNomes.map(n => `<span class="tag-curso">${n}</span>`).join('');
                            
                            // Monta seletor de ofertas
                            let selectOferta = `<select id="oferta-${index}" onchange="atualizarLinks(${index})">
                                <option value="">Selecione para oferecer...</option>
                                ${aluno.ofertas.map(o => `<option value="${o.id}" data-nome="${o.nome}">${o.nome}</option>`).join('')}
                            </select>`;

                            tr.innerHTML = `
                                <td><b>${aluno.nome}</b>  
<small style="color:#7A8FA3">${aluno.empresa}</small></td>
                                <td><small>${aluno.whatsapp}  
${aluno.email}</small></td>
                                <td>${tagsComprados || '<small style="color:#7A8FA3">Apenas Degustação</small>'}</td>
                                <td>${aluno.ofertas.length > 0 ? selectOferta : '<small>Já possui todos os cursos</small>'}</td>
                                <td>
                                    <a id="wa-${index}" class="btn-acao btn-wa" href="#" target="_blank">WhatsApp</a>
                                    <a id="mail-${index}" class="btn-acao" href="#">E-mail</a>
                                    <button class="btn-acao" onclick="liberarManual('${aluno.idAmbiente}', ${index})" style="border-color:#fff; color:#fff;">+ Liberar Manual</button>
                                </td>
                            `;
                            tbody.appendChild(tr);
                            atualizarLinks(index);
                        });
                    }
                });
        }

        function atualizarLinks(idx) {
            const aluno = dbAlunos[idx];
            const select = document.getElementById(`oferta-${idx}`);
            const cursoId = select ? select.value : "";
            const cursoNome = select && select.selectedIndex > 0 ? select.options[select.selectedIndex].text : "um novo módulo";
            
            const linkPagamento = "COLE_AQUI_O_LINK_ASAAS"; // Você pode automatizar isso vindo da planilha também
            
            // WHATSAPP
            const msgWA = `Olá ${aluno.nome}! Notamos seu progresso no Saber⁺. Preparamos uma condição especial para o curso *${cursoNome}*.\n\nLink para inscrição: ${linkPagamento}\n\nAssim que concluir, seu acesso será liberado na hora!`;
            document.getElementById(`wa-${idx}`).href = `https://wa.me/55${aluno.whatsapp.replace(/\D/g,'' )}?text=${encodeURIComponent(msgWA)}`;

            // EMAIL
            const assunto = `Oportunidade: Curso ${cursoNome} no Saber+`;
            const corpo = `Olá ${aluno.nome},\n\nParabéns pela sua jornada no Saber+!\n\nVi que você ainda não explorou o módulo "${cursoNome}". Gostaria de oferecer uma condição exclusiva para você continuar evoluindo.\n\nLink de acesso: ${linkPagamento}\n\nAtenciosamente,\nGestão Saber+`;
            document.getElementById(`mail-${idx}`).href = `mailto:${aluno.email}?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;
        }

        function liberarManual(idAmb, idx) {
            const select = document.getElementById(`oferta-${idx}`);
            if(!select || select.value === "") return alert("Selecione um curso na coluna 'Sugestão de Oferta' primeiro.");
            
            const cursoId = select.value;
            const cursoNome = select.options[select.selectedIndex].text;

            if(confirm(`Deseja liberar manualmente o curso "${cursoNome}" para o ambiente ${idAmb}?`)) {
                fetch(`${SCRIPT_URL}?action=liberarCurso&idAmbiente=${idAmb}&idCurso=${cursoId}`)
                    .then(r => r.json()).then(res => {
                        if(res.success) { alert("Curso liberado com sucesso!"); carregarDados(); }
                    });
            }
        }
    </script>
</body>
</html>
