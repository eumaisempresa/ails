<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Gestor AILS⁺</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;700&display=swap' );
        :root { --fundo: #060E18; --card: #0A1624; --dourado: #C4974A; --bordas: rgba(196, 151, 74, 0.2); }
        body { background: var(--fundo); color: #EEF0F2; font-family: 'DM Sans', sans-serif; padding: 40px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid var(--bordas); padding-bottom: 20px; }
        .card { background: var(--card); border: 1px solid var(--bordas); padding: 25px; border-radius: 4px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--bordas); font-size: 14px; }
        th { color: var(--dourado); text-transform: uppercase; font-size: 12px; }
        .btn-acao { padding: 5px 10px; background: transparent; border: 1px solid var(--dourado); color: var(--dourado); cursor: pointer; border-radius: 3px; font-size: 11px; }
        .btn-acao:hover { background: var(--dourado); color: #000; }
        #authOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--fundo); display: flex; justify-content: center; align-items: center; z-index: 999; }
    </style>
</head>
<body>
    <div id="authOverlay">
        <div class="card" style="width: 300px; text-align: center;">
            <h2 style="color: var(--dourado); font-family: 'Cormorant Garamond';">Acesso Gestor</h2>
            <input type="password" id="masterPass" placeholder="Senha Master" style="width:100%; padding:10px; margin: 15px 0; background:#0E1E30; border:1px solid var(--bordas); color:#fff;">
            <button onclick="autenticarGestor()" class="btn-acao" style="width:100%; padding:10px;">Entrar no Console</button>
        </div>
    </div>

    <div class="header">
        <h1 style="font-family: 'Cormorant Garamond'; color: var(--dourado);">Console Central AILS⁺</h1>
        <div id="stats">Ambientes Ativos: <span id="countAmbientes" style="color: var(--dourado); font-weight: bold;">0</span></div>
    </div>

    <div class="card">
        <h3>Ambientes e Alunos</h3>
        <table id="tabelaAlunos">
            <thead>
                <tr>
                    <th>ID Ambiente</th>
                    <th>Nome</th>
                    <th>Empresa</th>
                    <th>WhatsApp</th>
                    <th>Cursos Liberados</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <!-- Injetado via JS -->
            </tbody>
        </table>
    </div>

    <script>
        const SCRIPT_URL = "SUA_URL_DO_APPS_SCRIPT";
        let masterKey = "";

        function autenticarGestor() {
            const pass = document.getElementById('masterPass').value;
            // No Apps Script, criaremos uma função 'validarAdmin' que usa a Propriedade do Script
            fetch(`${SCRIPT_URL}?action=validarAdmin&senha=${pass}`)
                .then(r => r.json())
                .then(res => {
                    if(res.autorizado) {
                        masterKey = pass;
                        document.getElementById('authOverlay').style.display = 'none';
                        carregarDados();
                    } else { alert("Senha incorreta!"); }
                });
        }

        function carregarDados() {
            fetch(`${SCRIPT_URL}?action=carregarPainelGestor`)
                .then(r => r.json())
                .then(res => {
                    const tbody = document.querySelector('#tabelaAlunos tbody');
                    tbody.innerHTML = "";
                    document.getElementById('countAmbientes').innerText = res.data.alunos.length;
                    res.data.alunos.forEach(aluno => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${aluno.idAmbiente}</td>
                            <td>${aluno.nome}</td>
                            <td>${aluno.empresa}</td>
                            <td>${aluno.whatsapp}</td>
                            <td>${aluno.cursos || 'Nenhum'}</td>
                            <td><button class="btn-acao" onclick="liberarCurso('${aluno.idAmbiente}')">+ Liberar Curso</button></td>
                        `;
                        tbody.appendChild(tr);
                    });
                });
        }
    </script>
</body>
</html>
