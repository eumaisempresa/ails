<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Gestor AILS⁺ | EU⁺ Empresa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;700&display=swap' );
        :root { --fundo: #060E18; --card: #0A1624; --dourado: #C4974A; --bordas: rgba(196, 151, 74, 0.2); --accent: #25D366; }
        body { background: var(--fundo); color: #EEF0F2; font-family: 'DM Sans', sans-serif; padding: 0; margin: 0; min-height: 100vh; }
        .main-content { padding: 30px; max-width: 1400px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--bordas); padding-bottom: 20px; }
        .filters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid var(--bordas); }
        .filter-group label { display: block; font-size: 10px; color: var(--dourado); text-transform: uppercase; margin-bottom: 5px; font-weight: bold; }
        input, select { background: #0E1E30; border: 1px solid var(--bordas); color: #fff; padding: 10px; border-radius: 4px; width: 100%; font-size: 12px; }
        .card-table { background: var(--card); border: 1px solid var(--bordas); border-radius: 8px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid var(--bordas); font-size: 13px; }
        th { background: rgba(196, 151, 74, 0.05); color: var(--dourado); font-size: 11px; }
        .btn { padding: 10px 15px; border-radius: 4px; font-weight: bold; font-size: 11px; cursor: pointer; border: 1px solid var(--dourado); background: transparent; color: var(--dourado); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--dourado); color: #000; }
        .btn-wa { border-color: var(--accent); color: var(--accent); }
        .btn-wa:hover { background: var(--accent); color: #fff; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; margin: 2px; border: 1px solid var(--bordas); }
        .tag-paid { color: var(--accent); border-color: var(--accent); }
        .tag-interest { color: var(--dourado); border-color: var(--dourado); }
        .promo-box { display: flex; gap: 5px; margin-top: 8px; }
        .promo-input { width: 80px; padding: 5px; font-size: 11px; }
        #authOverlay { position: fixed; inset: 0; background: var(--fundo); display: flex; justify-content: center; align-items: center; z-index: 9999; }
    </style>
</head>
<body>
    <div id="authOverlay">
        <div class="card-table" style="width: 350px; padding: 40px; text-align: center; border: 1px solid var(--dourado);">
            <h2 style="color: var(--dourado); font-family: 'Cormorant Garamond';">AILS⁺ Gestor</h2>
            <input type="password" id="masterPass" placeholder="Senha Master Admin" style="text-align: center; margin-bottom: 20px;">
            <button onclick="autenticarGestor()" class="btn btn-primary" style="width: 100%;">ENTRAR</button>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1 style="font-family: 'Cormorant Garamond'; color: var(--dourado);">Console Central AILS⁺</h1>
            <div>
                <input type="text" id="chavePix" placeholder="Sua Chave PIX" style="width: 200px; margin-right: 10px;" value="eumaisempresa@gmail.com">
                <button class="btn btn-primary" onclick="carregarDados()"><i class="fas fa-sync-alt"></i> ATUALIZAR</button>
            </div>
        </div>

        <div class="filters-grid">
            <div class="filter-group"><label>Busca</label><input type="text" id="filterBusca" oninput="aplicarFiltros()"></div>
            <div class="filter-group">
                <label>Status</label>
                <select id="filterStatus" onchange="aplicarFiltros()">
                    <option value="todos">Todos</option>
                    <option value="interessado">Interessados</option>
                </select>
            </div>
        </div>

        <div class="card-table">
            <table id="tabelaAlunos">
                <thead>
                    <tr>
                        <th>Aluno</th>
                        <th>Contato</th>
                        <th>Cursos / Leads</th>
                        <th>Oferta (PIX Manual)</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwEwvmfIS7cWhkh35Mi8mRNGaVpbz-9wJWZYS6QOa9cmudlRemNvCXfq0iHAR-tD1yE/exec";
        let dbAlunos = [];
        let dbCatalogo = [];

        function autenticarGestor( ) {
            const pass = document.getElementById('masterPass').value;
            fetch(`${SCRIPT_URL}?action=validarAdmin&senha=${encodeURIComponent(pass)}`)
                .then(r => r.json()).then(res => {
                    if(res.autorizado) { document.getElementById('authOverlay').style.display = 'none'; carregarDados(); } 
                    else alert("Senha incorreta!");
                }).catch(() => alert("Erro de comunicação com o Apps Script. Verifique a URL e permissões."));
        }

        async function carregarDados() {
            const r = await fetch(`${SCRIPT_URL}?action=carregarPainelGestor`);
            const res = await r.json();
            if(res.success) {
                dbAlunos = res.data.alunos;
                dbCatalogo = res.data.catalogo;
                aplicarFiltros();
            }
        }

        function aplicarFiltros() {
            const busca = document.getElementById('filterBusca').value.toLowerCase();
            const status = document.getElementById('filterStatus').value;
            const filtrados = dbAlunos.filter(a => {
                const mB = !busca || a.nome.toLowerCase().includes(busca) || a.email.toLowerCase().includes(busca);
                const mS = status === 'todos' || (status === 'interessado' && a.interesses.length > 0);
                return mB && mS;
            });
            renderizarTabela(filtrados);
        }

        function renderizarTabela(alunos) {
            const tbody = document.querySelector('#tabelaAlunos tbody');
            tbody.innerHTML = "";
            alunos.forEach((aluno, index) => {
                const tr = document.createElement('tr');
                const tagsC = aluno.cursos.map(c => `<span class="tag tag-paid">${c.nome}</span>`).join('');
                const tagsI = aluno.interesses.map(i => {
                    const c = dbCatalogo.find(cc => cc.id === i.cursoId);
                    return `<span class="tag tag-interest">Interesse: ${c ? c.nome : i.cursoId}</span>`;
                }).join('');
                const sugestoes = dbCatalogo.map(o => `<option value="${o.id}" data-preco="${o.preco}">${o.nome} - R$ ${o.preco}</option>`).join('');
                
                tr.innerHTML = `
                    <td><b>${aluno.nome}</b>  
<small>${aluno.idAmbiente}</small></td>
                    <td>${aluno.whatsapp}  
<small>${aluno.email}</small></td>
                    <td>${tagsC} ${tagsI}</td>
                    <td>
                        <select id="sel-${index}"><option value="">Selecionar curso...</option>${sugestoes}</select>
                        <div class="promo-box"><input type="text" id="val-${index}" class="promo-input" placeholder="R$ Promo"></div>
                    </td>
                    <td>
                        <button class="btn btn-wa" onclick="enviarWA(${index})"><i class="fab fa-whatsapp"></i> WHATSAPP</button>
                        <button class="btn" onclick="liberarManual('${aluno.idAmbiente}', ${index})" style="margin-top:5px; width:100%">LIBERAR MANUAL</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function enviarWA(idx) {
            const aluno = dbAlunos[idx];
            const sel = document.getElementById(`sel-${idx}`);
            const val = document.getElementById(`val-${idx}`).value;
            const pix = document.getElementById('chavePix').value;
            
            if(!sel.value) return alert("Selecione um curso.");
            
            const curso = sel.options[sel.selectedIndex].text.split(' - ')[0];
            const preco = val || sel.options[sel.selectedIndex].getAttribute('data-preco');
            
            let msg = `Olá ${aluno.nome}! Preparamos uma condição especial para o curso *${curso}*.\n\n`;
            msg += `Valor exclusivo: *R$ ${preco}*\n`;
            msg += `Pagamento via PIX: *${pix}*\n\n`;
            msg += `Após o pagamento, envie o comprovante aqui para liberação imediata no seu painel!`;
            
            window.open(`https://wa.me/55${aluno.whatsapp.toString( ).replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function liberarManual(idA, idx) {
            const sel = document.getElementById(`sel-${idx}`);
            if(!sel.value) return alert("Selecione o curso.");
            if(confirm("Liberar acesso agora?")) {
                fetch(`${SCRIPT_URL}?action=liberarCurso&idAmbiente=${idA}&idCurso=${sel.value}`)
                    .then(() => { alert("Liberado!"); carregarDados(); });
            }
        }
    </script>
</body>
</html>
