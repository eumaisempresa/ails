<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saber⁺ - Ecossistema Executivo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500;700&family=Lora:wght@400;500;700&display=swap'  );
        :root { --fundo: #060E18; --card: #0A1624; --dourado: #C4974A; --texto: #EEF0F2; --bordas: rgba(196, 151, 74, 0.15); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { background: var(--fundo); color: var(--texto); font-family: 'DM Sans', sans-serif; height: 100vh; overflow: hidden; }
        
        /* OVERLAY DE LOGIN (EMBUTIDO PARA EVITAR REDIRECIONAMENTO 404) */
        #loginOverlay { position: fixed; inset: 0; background: var(--fundo); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .card-l { background: var(--card); padding: 40px; width: 90%; max-width: 400px; border-radius: 8px; text-align: center; border: 1px solid var(--bordas); }
        .card-l input { width: 100%; padding: 12px; margin: 10px 0; background: rgba(255,255,255,0.05); border: 1px solid var(--bordas); color: #fff; border-radius: 4px; outline: none; }
        .btn-g { width: 100%; padding: 14px; background: var(--dourado); color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-g:hover { opacity: 0.9; transform: translateY(-2px); }

        header { height: 70px; background: var(--card); border-bottom: 1px solid var(--bordas); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 100; }
        .painel-wrapper { display: flex; height: calc(100vh - 70px); width: 100%; }
        .sidebar { width: 320px; min-width: 320px; background: var(--card); border-right: 1px solid var(--bordas); padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        .content-body { flex: 1; background: #EAEFF4; overflow-y: auto; padding: 40px 20px; }
        .folha { background: #fff; max-width: 850px; margin: 0 auto; min-height: 100%; padding: 60px 50px; border-radius: 4px; color: #1a1a1a; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .notes-panel { width: 350px; min-width: 350px; background: var(--card); border-left: 1px solid var(--bordas); padding: 20px; display: flex; flex-direction: column; }
        
        /* FORMATAÇÃO DE CONTEÚDO */
        .google-doc-render { color: #222 !important; font-family: 'Lora', serif !important; font-size: 18px; line-height: 1.8; }
        .google-doc-render b, .google-doc-render strong { font-weight: 800 !important; color: #000 !important; }
        .google-doc-render table { width: 100% !important; border-collapse: collapse !important; margin: 25px 0 !important; border: 1px solid #ccc !important; }
        .google-doc-render td, .google-doc-render th { border: 1px solid #eee !important; padding: 10px !important; }

        /* MENU DE CURSOS */
        .course-item-sidebar { background: rgba(255,255,255,0.02); border: 1px solid var(--bordas); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .course-item-sidebar h3 { color: var(--dourado); font-size: 15px; margin-bottom: 10px; }
        .btn-action-sm { width: 100%; padding: 8px; font-size: 11px; font-weight: bold; border-radius: 4px; border: 1px solid var(--dourado); cursor: pointer; }
        .btn-acquired { background: var(--dourado); color: #000; }
        .btn-trial { background: transparent; color: var(--dourado); }

        /* MODAL DE COMPRA */
        #modalCompra { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; justify-content: center; align-items: center; }
        .modal-card { background: var(--card); border: 1px solid var(--dourado); padding: 40px; border-radius: 8px; text-align: center; max-width: 400px; width: 90%; }

        textarea { width: 100%; flex: 1; background: #FEF5B1; border: none; padding: 20px; font-family: 'Lora', serif; font-size: 16px; color: #333; margin-bottom: 20px; outline: none; }
    </style>
</head>
<body>
    <!-- Login Embutido -->
    <div id="loginOverlay">
        <div class="card-l" id="boxLogin">
            <h2 style="color:var(--dourado); margin-bottom:20px; font-family:'Cormorant Garamond'; font-size: 32px;">Saber⁺</h2>
            <input type="email" id="lEmail" placeholder="Seu e-mail">
            <input type="password" id="lSenha" placeholder="Sua senha">
            <button class="btn-g" onclick="fazerLogin()">ACESSAR AMBIENTE</button>
            <p id="loginStatus" style="color:var(--dourado); font-size:12px; margin-top:15px;"></p>
        </div>
    </div>

    <!-- Modal de Compra -->
    <div id="modalCompra">
        <div class="modal-card">
            <i class="fas fa-lock" style="font-size: 40px; color: var(--dourado); margin-bottom: 20px;"></i>
            <h2 style="color: var(--dourado); font-family: 'Cormorant Garamond'; margin-bottom: 15px;">Módulo Bloqueado</h2>
            <p style="color: #7A8FA3; margin-bottom: 25px;">Este conteúdo é exclusivo para alunos premium. Adquira o curso completo para liberar o acesso!</p>
            <button class="btn-g" onclick="alert('Redirecionando...')">ADQUIRIR AGORA</button>
            <p onclick="document.getElementById('modalCompra').style.display='none'" style="color:#555; font-size:12px; margin-top:15px; cursor:pointer;">Voltar</p>
        </div>
    </div>

    <header>
        <div style="font-family:'Cormorant Garamond'; color:var(--dourado); font-size:24px; font-weight:bold;">EU⁺ Saber</div>
        <div id="uInfo" style="font-size:13px; color:var(--dourado);"></div>
    </header>

    <div class="painel-wrapper">
        <div class="sidebar" id="side">
            <h4 style="color:var(--dourado); margin-bottom:15px; font-size:11px; letter-spacing:1px; text-transform:uppercase;">Seus Cursos</h4>
            <div id="lAulas" style="flex:1; overflow-y:auto;"></div>
        </div>
        <div class="content-body">
            <div class="folha">
                <div id="metaAula" style="display:none; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 12px; color: #7A8FA3; border-bottom: 1px dashed #ccc; padding-bottom: 10px;">
                    <span id="tempoLeitura">⏱️ Leitura: -- min</span>
                    <button style="padding: 6px 12px; border-radius: 20px; border: 1px solid #2ECC71; color: #2ECC71; background: transparent; cursor: pointer; font-size: 11px; font-weight: bold;">✓ CONCLUÍDA</button>
                </div>
                <h1 id="aTit" style="margin-bottom:20px; font-family:'Cormorant Garamond'; color:#0A3663;">Bem-vindo</h1>
                <div id="aCont" class="google-doc-render">Selecione um curso ao lado para começar.</div>
            </div>
        </div>
        <div class="notes-panel">
            <h3 style="color:var(--dourado); font-family:'Cormorant Garamond'; margin-bottom:10px;">Insights</h3>
            <textarea id="tAnot" placeholder="Suas anotações estratégicas..."></textarea>
            <button class="btn-g" onclick="salvarNota()">SALVAR INSIGHT</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwEwvmfIS7cWhkh35Mi8mRNGaVpbz-9wJWZYS6QOa9cmudlRemNvCXfq0iHAR-tD1yE/exec";
        let currentUser = null; let dbCursos = []; let aulaAtiva = null;

        function fazerLogin( ) {
            const email = document.getElementById('lEmail').value;
            const senha = document.getElementById('lSenha').value;
            const status = document.getElementById('loginStatus');
            status.innerText = "Verificando credenciais...";

            fetch(`${SCRIPT_URL}?action=validarAcesso&email=${encodeURIComponent(email)}&senha=${encodeURIComponent(senha)}`)
                .then(r => r.json()).then(res => {
                    if(res.autorizado) {
                        currentUser = res;
                        document.getElementById('uInfo').innerText = `EXECUTIVO: ${res.nome}`;
                        document.getElementById('loginOverlay').style.display = 'none'; 
                        carregarMenu();
                    } else { status.innerText = res.error || "Acesso negado."; }
                }).catch(() => { status.innerText = "Erro de conexão com o servidor."; });
        }

        function carregarMenu() {
            fetch(`${SCRIPT_URL}?action=carregarMenu&idAmbiente=${currentUser.idAmbiente}`).then(r => r.json()).then(res => { 
                if(res.success) { 
                    dbCursos = res.cursos; 
                    renderizarLobby(); 
                } 
            });
        }

        function renderizarLobby() {
            const grid = document.getElementById('lAulas'); grid.innerHTML = "";
            dbCursos.forEach(curso => {
                const div = document.createElement('div');
                div.className = "course-item-sidebar";
                div.innerHTML = `<h3>${curso.nome}</h3>
                    <button class="btn-action-sm ${curso.comprado ? 'btn-acquired' : 'btn-trial'}" onclick="abrirCurso('${curso.id}')">
                        ${curso.comprado ? 'CURSO ADQUIRIDO' : 'DEGUSTAÇÃO'}
                    </button>`;
                grid.appendChild(div);
            });
        }

        function abrirCurso(idCurso) {
            const curso = dbCursos.find(c => c.id === idCurso);
            const lista = document.getElementById('lAulas');
            lista.innerHTML = `<div onclick="renderizarLobby()" style="color:var(--dourado); cursor:pointer; margin-bottom:20px; font-size:12px; font-weight:bold;">← VOLTAR</div>`;
            
            curso.aulas.forEach((aula, index) => {
                const bloqueada = !curso.comprado && index > 0;
                const div = document.createElement('div');
                div.style.cssText = `padding:12px; margin-bottom:8px; background:rgba(255,255,255,0.05); border-radius:4px; cursor:pointer; font-size:13px; opacity:${bloqueada ? '0.5' : '1'}; display:flex; justify-content:space-between;`;
                div.innerHTML = `<span>${index + 1}. ${aula.titulo}</span> ${bloqueada ? '🔒' : ''}`;
                div.onclick = () => {
                    if(bloqueada) document.getElementById('modalCompra').style.display = 'flex';
                    else carregarAula(aula, idCurso);
                };
                lista.appendChild(div);
            });
            carregarAula(curso.aulas[0], idCurso);
        }

        function carregarAula(aula, idCurso) {
            aulaAtiva = { ...aula, idCurso: idCurso };
            document.getElementById('aTit').innerText = aula.titulo;
            const area = document.getElementById('aCont'); area.innerHTML = "Carregando conteúdo...";
            document.getElementById('metaAula').style.display = 'none';

            fetch(`${SCRIPT_URL}?action=carregarAula&idAmbiente=${currentUser.idAmbiente}&idCurso=${idCurso}&idAula=${aula.id}&idDoc=${aula.idDoc}`)
                .then(r => r.json()).then(res => { 
                    area.innerHTML = res.conteudo; 
                    document.getElementById('tAnot').value = res.anotacao || "";
                    document.getElementById('metaAula').style.display = 'flex';
                    const palavras = area.innerText.split(/\s+/).length;
                    document.getElementById('tempoLeitura').innerText = `⏱️ Leitura: ${Math.ceil(palavras / 200)} min`;
                });
        }

        function salvarNota() {
            if(!aulaAtiva) return;
            fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "salvarAnotacao", idAmbiente: currentUser.idAmbiente, idCurso: aulaAtiva.idCurso, idAula: aulaAtiva.id, texto: document.getElementById('tAnot').value }) })
            .then(() => alert("Insight salvo!"));
        }
    </script>
</body>
</html>
