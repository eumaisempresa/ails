<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro AILS - Saber⁺</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500;700&display=swap' );
        :root {
            --fundo: #060E18; --card: #0A1624; --dourado: #C4974A; --texto: #EEF0F2; --bordas: rgba(196, 151, 74, 0.2);
        }
        body { background: var(--fundo); color: var(--texto); font-family: 'DM Sans', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card-cadastro { background: var(--card); border: 1px solid var(--bordas); padding: 40px; width: 100%; max-width: 450px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { font-family: 'Cormorant Garamond', serif; color: var(--dourado); text-align: center; margin-bottom: 30px; }
        label { display: block; font-size: 12px; color: var(--dourado); text-transform: uppercase; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; margin-bottom: 20px; background: #0E1E30; border: 1px solid var(--bordas); color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--dourado); border: none; color: #000; font-weight: bold; cursor: pointer; border-radius: 4px; text-transform: uppercase; transition: 0.3s; }
        button:hover { background: #D4AA62; transform: translateY(-2px); }
        .success-box { display: none; text-align: center; border: 1px solid var(--dourado); padding: 20px; background: rgba(196, 151, 74, 0.1); }
    </style>
</head>
<body>
    <div class="card-cadastro" id="boxMain">
        <h1>Inicie sua Jornada AILS⁺</h1>
        <form id="formCadastro">
            <label>Nome Completo</label>
            <input type="text" id="nome" required placeholder="Seu nome">
            <label>E-mail Corporativo</label>
            <input type="email" id="email" required placeholder="seu@email.com">
            <label>WhatsApp</label>
            <input type="tel" id="whatsapp" required placeholder="27 99999-9999">
            <label>Empresa</label>
            <input type="text" id="empresa" required placeholder="Nome da sua empresa">
            <button type="submit" id="btnSubmit">Criar meu Ambiente Inteligente</button>
        </form>
        <div id="successBox" class="success-box">
            <h2 style="color: var(--dourado);">Ambiente Criado!</h2>
            <p>Seu ID de acesso: <strong id="resId" style="color:#fff;"></strong></p>
            <p>Sua senha provisória: <strong id="resSenha" style="color:#fff;"></strong></p>
            <a href="../painel/" style="color: var(--dourado); text-decoration: none; font-weight: bold; display: block; margin-top: 20px;">ACESSAR PAINEL AGORA →</a>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwEwvmfIS7cWhkh35Mi8mRNGaVpbz-9wJWZYS6QOa9cmudlRemNvCXfq0iHAR-tD1yE/exec";
        document.getElementById('formCadastro').onsubmit = function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.innerText = "Configurando AILS...";
            btn.disabled = true;

            const randomId = "AILS" + Math.floor(1000 + Math.random() * 9000);
            const pass = Math.random().toString(36).slice(-6).toUpperCase();

            const payload = {
                action: "cadastrarAluno",
                idAmbiente: randomId,
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                whatsapp: document.getElementById('whatsapp').value,
                empresa: document.getElementById('empresa').value,
                senha: pass
            };

// No cadastro/index.html, substitua o bloco do fetch por este:
fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify(payload)
})
.then(response => response.json())
.then(res => {
    if(res.success) {
        document.getElementById('formCadastro').style.display = 'none';
        document.getElementById('successBox').style.display = 'block';
        document.getElementById('resId').innerText = randomId;
        document.getElementById('resSenha').innerText = pass;
    } else {
        alert("Erro ao salvar: " + res.error);
        btn.disabled = false;
        btn.innerText = "Criar meu Ambiente Inteligente";
    }
})
.catch(err => {
    console.error(err);
    alert("Erro na comunicação com o servidor.");
    btn.disabled = false;
});
