<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saber⁺ - EU⁺ Executivo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;700&display=swap' );
        :root { --fundo: #060E18; --card: #0A1624; --dourado: #C4974A; --texto: #EEF0F2; --bordas: rgba(196, 151, 74, 0.18); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--fundo); color: var(--texto); font-family: 'DM Sans', sans-serif; line-height: 1.6; }
        h1, h2, .logo-saber { font-family: 'Cormorant Garamond', serif; color: var(--dourado); }
        .hero { text-align: center; padding: 120px 20px; background: radial-gradient(circle at center, var(--card) 0%, var(--fundo) 100%); border-bottom: 1px solid var(--bordas); }
        .logo-saber { font-size: 64px; margin-bottom: 20px; color: #fff; }
        .logo-saber span { color: var(--dourado); font-size: 45px; vertical-align: super; }
        .btn { background: transparent; border: 1px solid var(--dourado); color: var(--dourado); padding: 14px 32px; text-transform: uppercase; font-size: 13px; cursor: pointer; border-radius: 4px; text-decoration: none; display: inline-block; transition: 0.3s; }
        .btn:hover { background: var(--dourado); color: var(--fundo); }
        .container { max-width: 1200px; margin: 0 auto; padding: 60px 20px; }
        .footer-signature { text-align: center; padding: 50px 20px; border-top: 1px solid var(--bordas); color: #7A8FA3; font-size: 13px; margin-top: 60px; }
    </style>
</head>
<body>
    <div class="hero">
        <div class="logo-saber">Saber<span>+</span></div>
        <p style="font-style: italic; font-size: 22px; color: #7A8FA3; margin-bottom: 36px;">"Seu Ambiente de ensino e aprendizado"</p>
        <a href="cadastro/" class="btn">Cadastre-se</a>
    </div>

    <div class="container">
        <section style="text-align: center; padding: 40px; border: 1px dashed var(--bordas); border-radius: 4px;">
            <h3 style="font-size: 24px; margin-bottom: 12px; color: var(--dourado);">Já possui acesso?</h3>
            <p style="color: #7A8FA3; margin-bottom: 24px;">Acesse seu ambiente corporativo e retome seus estudos.</p>
            <!-- O LINK ABAIXO FOI ATUALIZADO PARA /login/ -->
            <a href="login/" class="btn" style="border-color: #7A8FA3; color: #fff;">Acessar Meu Ambiente</a>
        </section>
    </div>

    <div class="footer-signature">
        <div style="font-style: italic; font-size: 18px; color: var(--dourado); margin-bottom: 12px;">"Você é o EU. Nós somos o ⁺ que soma com você."</div>
        <p>© 2026 Ecossistema EU⁺. Todos os direitos reservados.</p>
    </div>
</body>
</html>
