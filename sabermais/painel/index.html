<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saber⁺ - Ambiente Executivo</title>
    <style>
        /* [ESTILOS BASE E VARIÁVEIS - MANTIDOS DO DESIGN ORIGINAL] */
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap' );
        
        :root {
            --fundo-principal: #060E18;
            --fundo-secundario: #0A1624;
            --fundo-terciario: #0E1E30;
            --dourado-principal: #C4974A;
            --dourado-secundario: #D4AA62;
            --texto-principal: #EEF0F2;
            --texto-secundario: #7A8FA3;
            --bordas: rgba(196, 151, 74, 0.18);
        }

        body { background: var(--fundo-principal); color: var(--texto-principal); font-family: 'DM Sans', sans-serif; margin: 0; }
        
        /* RENDERIZADOR PREMIUM GOOGLE DOCS */
        .google-doc-render {
            font-family: 'Lora', serif;
            color: #1A2430;
            line-height: 1.8;
            text-align: justify;
        }
        .google-doc-render strong, .google-doc-render b { font-weight: 700 !important; color: #000; }
        .google-doc-render table { width: 100% !important; border-collapse: collapse; margin: 20px 0; background: #fff; }
        .google-doc-render td, .google-doc-render th { border: 1px solid #ddd; padding: 12px; }
        .google-doc-render ul, .google-doc-render ol { padding-left: 20px; margin-bottom: 20px; }

        /* LOBBY E CARDS */
        .lobby-container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; display: block; }
        .courses-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .course-card { background: var(--fundo-secundario); border: 1px solid var(--bordas); border-radius: 8px; padding: 20px; transition: 0.3s; }
        .course-card:hover { transform: translateY(-5px); border-color: var(--dourado-principal); }
        
        /* LEITOR (Oculto por padrão) */
        .viewer-container { display: none; grid-template-columns: 280px 1fr 320px; height: 100vh; }
        
        /* OVERLAY DE LOGIN */
        #loginOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--fundo-principal); z-index: 9999; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="loginOverlay">
        <div style="background: var(--fundo-secundario); padding: 40px; border: 1px solid var(--bordas); width: 350px;">
            <h2 style="text-align:center; color: var(--dourado-principal);">Saber⁺ Login</h2>
            <input type="email" id="email" placeholder="E-mail" style="width:100%; padding:10px; margin: 10px 0; background: var(--fundo-terciario); color:#fff; border:1px solid var(--bordas);">
            <input type="password" id="senha" placeholder="Senha" style="width:100%; padding:10px; margin: 10px 0; background: var(--fundo-terciario); color:#fff; border:1px solid var(--bordas);">
            <button onclick="fazerLogin()" style="width:100%; padding:12px; background: var(--dourado-principal); border:none; cursor:pointer; font-weight:bold;">ACESSAR AMBIENTE</button>
        </div>
    </div>

    <!-- TELA DO LOBBY (LISTA DE CURSOS) -->
    <div id="lobbyView" class="lobby-container">
        <h1 class="brand-title">Meus Cursos e Missões</h1>
        <div id="gridCursos" class="courses-grid">
            <!-- Cards gerados via JS -->
        </div>
    </div>

    <!-- TELA DO LEITOR (CADERNO) -->
    <div id="readView" class="viewer-container">
        <aside style="background: var(--fundo-secundario); border-right: 1px solid var(--bordas); padding: 20px;">
            <button onclick="voltarLobby()" style="color: var(--dourado-principal); background:none; border:none; cursor:pointer; margin-bottom:20px;">← Voltar ao Lobby</button>
            <div id="listaAulas"></div>
        </aside>
        <main style="background: #EAEFF4; overflow-y: auto; padding: 40px;">
            <div id="conteudoAula" class="google-doc-render" style="background: #fff; padding: 50px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); min-height: 100%;">
                Selecione uma aula para iniciar a leitura.
            </div>
        </main>
        <aside style="background: var(--fundo-secundario); border-left: 1px solid var(--bordas); padding: 20px;">
            <h3 style="color: var(--dourado-principal);">Suas Anotações</h3>
            <textarea id="campoNota" style="width:100%; height: 300px; background: #FEF5B1; font-family: 'Lora'; padding: 15px; border:none;"></textarea>
            <button onclick="salvarNota()" style="width:100%; margin-top: 10px; padding: 10px; background: var(--dourado-principal); border:none; cursor:pointer;">Salvar Insight</button>
        </aside>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwEwvmfIS7cWhkh35Mi8mRNGaVpbz-9wJWZYS6QOa9cmudlRemNvCXfq0iHAR-tD1yE/exec";
        let currentUser = null;
        let dbCursos = [];

        function fazerLogin() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            
            fetch(`${SCRIPT_URL}?action=validarAcesso&email=${email}&senha=${senha}`)
                .then(r => r.json())
                .then(res => {
                    if(res.autorizado) {
                        currentUser = res;
                        document.getElementById('loginOverlay').style.display = 'none';
                        carregarCursos();
                    } else {
                        alert("Erro: " + res.error);
                    }
                });
        }

        function carregarCursos() {
            fetch(`${SCRIPT_URL}?action=carregarMenu`)
                .then(r => r.json())
                .then(res => {
                    dbCursos = res.dados;
                    renderizarLobby();
                });
        }

function renderizarLobby() {
    const grid = document.getElementById('gridCursos');
    grid.innerHTML = "";
    const idsUnicos = [...new Set(dbCursos.map(c => c.idCurso))];
    
    // Formatador de Moeda Brasileira
    const formatter = new Intl.NumberFormat('pt-BR', {
        style: 'currency',
        currency: 'BRL',
    });
    
    idsUnicos.forEach(id => {
        const curso = dbCursos.find(c => c.idCurso === id);
        const jaComprou = (currentUser.cursosComprados || []).includes(id);
        
        // Converte o preço para número antes de formatar
        const precoFormatado = formatter.format(parseFloat(curso.preco.toString().replace(',', '.')));
        
        const div = document.createElement('div');
        div.className = "course-card";
        div.innerHTML = `
            <h3>${curso.nomeCurso}</h3>
            <p>${curso.descricao || 'Explore este novo módulo de conhecimento estratégico.'}</p>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="color:var(--dourado-secundario); font-weight:bold;">${jaComprou ? '✓ ADQUIRIDO' : precoFormatado}</span>
                <button onclick="abrirCurso('${id}')" style="padding:8px 12px; background:${jaComprou ? 'var(--dourado-principal)' : 'transparent'}; border:1px solid var(--dourado-principal); color:${jaComprou ? '#000' : '#C4974A'}; cursor:pointer; font-weight:bold; border-radius:4px;">
                    ${jaComprou ? 'ESTUDAR' : 'DEGUSTAÇÃO'}
                </button>
            </div>
        `;
        grid.appendChild(div);
    });
}

function abrirCurso(idCurso) {
    document.getElementById('lobbyView').style.display = 'none';
    document.getElementById('readView').style.display = 'grid';
    
    const aulas = dbCursos.filter(c => c.idCurso === idCurso);
    const jaComprou = (currentUser.cursosComprados || []).includes(idCurso);
    const lista = document.getElementById('listaAulas');
    lista.innerHTML = `<h3 style="color:#fff; font-size:16px; margin-bottom:15px;">${aulas[0].nomeCurso}</h3>`;
    
    aulas.forEach((aula, idx) => {
        const bloqueada = !jaComprou && idx > 0;
        const div = document.createElement('div');
        div.style = `padding:12px; margin-bottom:8px; background:var(--fundo-terciario); border-radius:4px; cursor:${bloqueada ? 'pointer' : 'pointer'}; opacity:${bloqueada ? 0.6 : 1}; color:${bloqueada ? '#d4aa62' : '#eee'}; font-size:14px; position:relative;`;
        div.innerHTML = `${aula.tituloAula} ${bloqueada ? '<span style="float:right;">🔒</span>' : ''}`;
        
        if(!bloqueada) {
            div.onclick = () => carregarConteudo(aula);
        } else {
            // REDIRECIONAMENTO DE PAGAMENTO
            div.onclick = () => {
                if(confirm("Este capítulo faz parte do curso completo. Deseja ir para a página de pagamento agora?")) {
                    // Substitua pela sua URL de pagamento/checkout
                    const checkoutUrl = `https://ails.eumaisempresa.com.br/pagamento/?curso=${idCurso}&ambiente=${currentUser.idAmbiente}`;
                    window.open(checkoutUrl, '_blank' );
                }
            };
        }
        lista.appendChild(div);
    });
    
    if(aulas.length > 0) carregarConteudo(aulas[0]);
}

        function carregarConteudo(aula) {
            document.getElementById('conteudoAula').innerHTML = "Carregando conteúdo premium...";
            fetch(`${SCRIPT_URL}?action=carregarAula&idAmbiente=${currentUser.idAmbiente}&idCurso=${aula.idCurso}&idAula=${aula.idAula}&idDoc=${aula.idDoc}`)
                .then(r => r.json())
                .then(res => {
                    document.getElementById('conteudoAula').innerHTML = res.conteudo;
                    document.getElementById('campoNota').value = res.anotacao || "";
                });
        }

        function voltarLobby() {
            document.getElementById('lobbyView').style.display = 'block';
            document.getElementById('readView').style.display = 'none';
        }
    </script>
</body>
</html>
