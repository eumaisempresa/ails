<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saber⁺ - Ambiente Inteligente AILS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500;700&family=Lora:wght@400;500;700&display=swap' );
        
        :root {
            --fundo: #060E18;
            --card: #0A1624;
            --dourado: #C4974A;
            --texto: #EEF0F2;
            --texto-sec: #7A8FA3;
            --bordas: rgba(196, 151, 74, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { background: var(--fundo); color: var(--texto); font-family: 'DM Sans', sans-serif; height: 100vh; overflow: hidden; }

        /* HEADER */
        header {
            height: 70px; background: var(--card); border-bottom: 1px solid var(--bordas);
            display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
            z-index: 100; position: relative;
        }
        .brand { font-family: 'Cormorant Garamond', serif; color: var(--dourado); font-size: 24px; font-weight: bold; }

        /* LAYOUT PRINCIPAL */
        .painel-wrapper { display: flex; height: calc(100vh - 70px); width: 100%; position: relative; }

        /* SIDEBAR (MENU AULAS) */
        .sidebar {
            width: 300px; min-width: 300px; background: var(--card); border-right: 1px solid var(--bordas);
            padding: 20px; overflow-y: auto; transition: transform 0.3s ease;
        }

        /* ÁREA DE CONTEÚDO */
        .content-body { flex: 1; background: #EAEFF4; overflow-y: auto; padding: 40px 20px; position: relative; }
        .folha-caderno {
            background: #fff; max-width: 850px; margin: 0 auto; min-height: 100%;
            padding: 60px 50px; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: relative;
        }
        
        /* TEXTO DO GOOGLE DRIVE */
        .google-doc-render {
            font-family: 'Lora', serif; font-size: 18px; line-height: 1.8; color: #1a1a1a !important;
            text-align: justify;
        }
        .google-doc-render * { color: #1a1a1a !important; background: transparent !important; }
        .google-doc-render h1, .google-doc-render h2 { font-family: 'Cormorant Garamond', serif; color: #0A3663 !important; margin: 30px 0 15px; }

        /* PAINEL DE NOTAS */
        .notes-panel {
            width: 350px; min-width: 350px; background: var(--card); border-left: 1px solid var(--bordas);
            padding: 20px; display: flex; flex-direction: column; transition: transform 0.3s ease;
        }
        .post-it {
            background: #FEF5B1; flex: 1; padding: 20px; border-radius: 2px;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.2); position: relative; margin-bottom: 20px;
        }
        .post-it textarea {
            width: 100%; height: 100%; background: transparent; border: none; outline: none;
            font-family: 'Lora', serif; font-size: 16px; color: #333; resize: none;
        }

        /* RESPONSIVIDADE (MOBILE) */
        @media (max-width: 900px) {
            .sidebar { position: fixed; left: 0; top: 70px; bottom: 0; z-index: 99; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            
            .notes-panel { position: fixed; right: 0; top: 70px; bottom: 0; z-index: 99; transform: translateX(100%); }
            .notes-panel.open { transform: translateX(0); }

            .folha-caderno { padding: 40px 20px; }
            .google-doc-render { font-size: 16px; }
        }

        /* BOTÕES FLUTUANTES MOBILE */
        .mobile-btn {
            display: none; position: fixed; bottom: 20px; width: 50px; height: 50px;
            background: var(--dourado); color: #000; border-radius: 50%;
            justify-content: center; align-items: center; font-size: 20px; z-index: 1000; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        @media (max-width: 900px) {
            .mobile-btn.menu { display: flex; left: 20px; }
            .mobile-btn.notes { display: flex; right: 20px; }
        }

        /* LOGIN OVERLAY */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--fundo); display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .login-card {
            background: var(--card); border: 1px solid var(--bordas); padding: 40px;
            width: 90%; max-width: 400px; border-radius: 8px; text-align: center;
        }
        .login-card input {
            width: 100%; padding: 12px; margin: 10px 0; background: rgba(255,255,255,0.05);
            border: 1px solid var(--bordas); color: #fff; border-radius: 4px;
        }
        .btn-gold {
            width: 100%; padding: 14px; background: var(--dourado); color: #000;
            border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-card">
            <h2 style="color:var(--dourado); margin-bottom:10px;">AILS Saber⁺</h2>
            <p style="color:var(--texto-sec); font-size:14px; margin-bottom:20px;">Ambiente Inteligente de Negócios</p>
            <input type="email" id="loginEmail" placeholder="E-mail">
            <input type="password" id="loginSenha" placeholder="Senha">
            <button class="btn-gold" onclick="fazerLogin()">AUTENTICAR</button>
        </div>
    </div>

    <header>
        <div class="brand">EU⁺ Saber</div>
        <div id="userInfo" style="font-size: 14px; color: var(--dourado);"></div>
    </header>

    <div class="painel-wrapper">
        <div class="sidebar" id="sidebar">
            <h4 style="color:var(--texto-sec); font-size:12px; text-transform:uppercase; margin-bottom:15px;">Cronograma</h4>
            <div id="listaAulas"></div>
        </div>

        <div class="content-body">
            <div class="folha-caderno">
                <h1 id="aulaTitulo" style="margin-bottom: 20px; font-family:'Cormorant Garamond'; color:#0A3663;">Selecione uma aula</h1>
                <div id="aulaConteudo" class="google-doc-render">
                    O conteúdo da aula aparecerá aqui após a seleção no menu.
                </div>
            </div>
        </div>

        <div class="notes-panel" id="notesPanel">
            <h3 style="color:var(--dourado); font-family:'Cormorant Garamond'; margin-bottom:10px;">Insights</h3>
            <div class="post-it">
                <textarea id="txtAnotacoes" placeholder="Escreva aqui suas reflexões..."></textarea>
            </div>
            <button class="btn-gold" onclick="salvarNota()">SALVAR INSIGHT</button>
        </div>
    </div>

    <!-- BOTÕES MOBILE -->
    <div class="mobile-btn menu" onclick="toggleSidebar()">📚</div>
    <div class="mobile-btn notes" onclick="toggleNotes()">✍️</div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwEwvmfIS7cWhkh35Mi8mRNGaVpbz-9wJWZYS6QOa9cmudlRemNvCXfq0iHAR-tD1yE/exec";
        
        let currentUser = null;
        let dbCursos = [];
        let aulaAtiva = null;

        function toggleSidebar( ) { document.getElementById('sidebar').classList.toggle('open'); }
        function toggleNotes() { document.getElementById('notesPanel').classList.toggle('open'); }

        function fazerLogin() {
            const email = document.getElementById('loginEmail').value;
            const senha = document.getElementById('loginSenha').value;
            fetch(`${SCRIPT_URL}?action=validarAcesso&email=${encodeURIComponent(email)}&senha=${encodeURIComponent(senha)}`)
                .then(r => r.json()).then(res => {
                    if(res.autorizado) {
                        currentUser = res;
                        document.getElementById('userInfo').innerText = `Olá, ${res.nome}`;
                        document.getElementById('loginOverlay').style.display = 'none';
                        carregarMenu();
                    } else { alert("Acesso negado."); }
                });
        }

        function carregarMenu() {
            fetch(`${SCRIPT_URL}?action=carregarMenu`).then(r => r.json()).then(res => {
                if(res.success) {
                    dbCursos = res.dados;
                    renderizarMenu();
                }
            });
        }

        function renderizarMenu() {
            const lista = document.getElementById('listaAulas');
            lista.innerHTML = "";
            dbCursos.forEach((aula, index) => {
                const item = document.createElement('div');
                item.style.cssText = "padding:12px; margin-bottom:8px; background:rgba(255,255,255,0.05); border-radius:4px; cursor:pointer; font-size:14px;";
                item.innerText = `${index + 1}. ${aula.tituloAula}`;
                item.onclick = () => {
                    document.getElementById('aulaTitulo').innerText = aula.tituloAula;
                    carregarAula(aula);
                    if(window.innerWidth <= 900) toggleSidebar();
                };
                lista.appendChild(item);
            });
        }

        function carregarAula(aula) {
            aulaAtiva = aula;
            const area = document.getElementById('aulaConteudo');
            area.innerHTML = "Sincronizando conteúdo...";
            fetch(`${SCRIPT_URL}?action=carregarAula&idAmbiente=${currentUser.idAmbiente}&idCurso=${aula.idCurso}&idAula=${aula.idAula}&idDoc=${aula.idDoc}`)
                .then(r => r.json()).then(res => {
                    area.innerHTML = res.conteudo;
                    document.getElementById('txtAnotacoes').value = res.anotacao || "";
                });
        }

        function salvarNota() {
            if(!aulaAtiva) return;
            const texto = document.getElementById('txtAnotacoes').value;
            fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "salvarAnotacao", idAmbiente: currentUser.idAmbiente, idCurso: aulaAtiva.idCurso, idAula: aulaAtiva.idAula, texto: texto })
            }).then(() => alert("Insight salvo!"));
        }
    </script>
</body>
</html>
