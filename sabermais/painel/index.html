<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Aluno | AILS⁺ Saber</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;700&display=swap' );
        
        :root {
            --fundo: #060E18;
            --card: #0A1624;
            --dourado: #C4974A;
            --texto: #EEF0F2;
            --texto-dim: #7A8FA3;
            --bordas: rgba(196, 151, 74, 0.2);
        }

        body {
            background: var(--fundo);
            color: var(--texto);
            font-family: 'DM Sans', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 320px;
            background: var(--card);
            border-right: 1px solid var(--bordas);
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }

        .sidebar-header {
            padding: 30px;
            border-bottom: 1px solid var(--bordas);
        }

        .btn-voltar {
            color: var(--dourado);
            text-decoration: none;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .lista-aulas {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .item-aula {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-aula:hover { background: rgba(196, 151, 74, 0.05); border-color: var(--bordas); }
        .item-aula.ativa { background: rgba(196, 151, 74, 0.1); border-color: var(--dourado); }
        .item-aula.bloqueada { opacity: 0.6; cursor: not-allowed; }

        /* ÁREA DE LEITURA */
        .leitor {
            flex: 1;
            overflow-y: auto;
            padding: 60px 40px;
            background: var(--fundo);
        }

        .container-texto {
            max-width: 850px;
            margin: 0 auto;
        }

        .header-aula {
            margin-bottom: 40px;
            border-bottom: 1px solid var(--bordas);
            padding-bottom: 20px;
        }

        .header-aula h1 {
            font-family: 'Cormorant Garamond', serif;
            color: var(--dourado);
            font-size: 38px;
            margin: 0;
        }

        /* FORMATAÇÃO DO CONTEÚDO (O CORAÇÃO DO LEITOR) */
        .conteudo-dinamico {
            line-height: 1.8;
            font-size: 17px;
            color: #d1d5db;
        }

        .conteudo-dinamico h2, .conteudo-dinamico h3 {
            color: var(--dourado);
            font-family: 'Cormorant Garamond', serif;
            margin-top: 40px;
        }

        .conteudo-dinamico p { margin-bottom: 25px; }
        
        /* Suporte a Negrito e Sublinhado */
        .conteudo-dinamico b, .conteudo-dinamico strong { 
            font-weight: 700 !important; 
            color: #fff; 
        }
        .conteudo-dinamico u { text-decoration: underline; }

        /* Tabelas Premium */
        .conteudo-dinamico table {
            width: 100%;
            border-collapse: collapse;
            margin: 30px 0;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--bordas);
        }

        .conteudo-dinamico th {
            background: rgba(196, 151, 74, 0.15);
            color: var(--dourado);
            padding: 15px;
            text-align: left;
            border: 1px solid var(--bordas);
        }

        .conteudo-dinamico td {
            padding: 12px 15px;
            border: 1px solid rgba(196, 151, 74, 0.1);
        }

        .conteudo-dinamico tr:nth-child(even) { background: rgba(255,255,255,0.01); }

        /* MODAL DE COMPRA */
        .modal-compra {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card);
            border: 1px solid var(--dourado);
            padding: 40px;
            max-width: 400px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .btn-acao {
            background: var(--dourado);
            color: #000;
            border: none;
            padding: 15px 30px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-acao:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(196, 151, 74, 0.3); }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; max-height: 300px; }
            .leitor { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div id="modalCompra" class="modal-compra">
        <div class="modal-content">
            <i class="fas fa-lock" style="font-size: 40px; color: var(--dourado); margin-bottom: 20px;"></i>
            <h2 style="font-family: 'Cormorant Garamond'; color: var(--dourado);">Conteúdo Exclusivo</h2>
            <p style="color: var(--texto-dim); margin-bottom: 30px;">
                Este capítulo faz parte da versão completa. Adquira agora para liberar o acesso vitalício a este curso!
            </p>
            <button class="btn-acao" onclick="irParaPagamento()" style="width: 100%;">Liberar Agora</button>
            <button onclick="fecharModal()" style="background:transparent; border:none; color:#555; margin-top:20px; cursor:pointer;">Voltar ao início</button>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">
            <a href="../lobby/" class="btn-voltar"><i class="fas fa-arrow-left"></i> Voltar ao Catálogo</a>
            <h3 id="nomeCurso" style="margin: 0; font-family: 'Cormorant Garamond'; font-size: 24px;">Carregando...</h3>
        </div>
        <div class="lista-aulas" id="listaAulas"></div>
    </div>

    <div class="leitor">
        <div class="container-texto">
            <div id="loader" style="text-align: center; margin-top: 100px; display: none;">
                <i class="fas fa-spinner fa-spin" style="font-size: 30px; color: var(--dourado);"></i>
            </div>
            <div id="areaConteudo">
                <div class="header-aula">
                    <h1 id="tituloAula">Selecione uma aula</h1>
                </div>
                <div class="conteudo-dinamico" id="corpoAula">
                    Escolha um capítulo ao lado para iniciar sua leitura.
                </div>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwEwvmfIS7cWhkh35Mi8mRNGaVpbz-9wJWZYS6QOa9cmudlRemNvCXfq0iHAR-tD1yE/exec";
        let cursoAtual = null;
        const urlParams = new URLSearchParams(window.location.search );
        const idCurso = urlParams.get('id');
        const idAmbiente = localStorage.getItem('idAmbiente');

        function init() {
            if(!idCurso || !idAmbiente) { window.location.href = "../login/"; return; }
            carregarDadosCurso();
        }

        function carregarDadosCurso() {
            fetch(`${SCRIPT_URL}?action=carregarMenu&idAmbiente=${idAmbiente}`)
            .then(r => r.json()).then(res => {
                const curso = res.cursos.find(c => c.id === idCurso);
                if(curso) {
                    cursoAtual = curso;
                    document.getElementById('nomeCurso').innerText = curso.nome;
                    renderizarMenu(curso.aulas, curso.comprado);
                    // Carrega a primeira aula automaticamente
                    selecionarAula(curso.aulas[0].id, curso.aulas[0].idDoc, false);
                }
            });
        }

        function renderizarMenu(aulas, comprado) {
            const lista = document.getElementById('listaAulas');
            lista.innerHTML = "";
            aulas.forEach((aula, index) => {
                const bloqueada = (index > 0 && !comprado);
                const div = document.createElement('div');
                div.className = `item-aula ${bloqueada ? 'bloqueada' : ''}`;
                div.innerHTML = `
                    <span>${aula.titulo}</span>
                    ${bloqueada ? '<i class="fas fa-lock" style="font-size:10px"></i>' : ''}
                `;
                div.onclick = () => selecionarAula(aula.id, aula.idDoc, bloqueada);
                lista.appendChild(div);
            });
        }

        function selecionarAula(idAula, idDoc, bloqueada) {
            if(bloqueada) {
                document.getElementById('modalCompra').style.display = 'flex';
                return;
            }

            document.getElementById('loader').style.display = 'block';
            document.getElementById('areaConteudo').style.opacity = '0.3';

            fetch(`${SCRIPT_URL}?action=carregarAula&idAmbiente=${idAmbiente}&idCurso=${idCurso}&idAula=${idAula}&idDoc=${idDoc}`)
            .then(r => r.json()).then(res => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('areaConteudo').style.opacity = '1';
                document.getElementById('tituloAula').innerText = res.titulo;
                document.getElementById('corpoAula').innerHTML = res.conteudo;
            });
        }

        function fecharModal() { document.getElementById('modalCompra').style.display = 'none'; }
        
        function irParaPagamento() {
            alert("Você será direcionado para o pagamento seguro do Asaas.");
            // Futuramente: window.location.href = `checkout.html?curso=${idCurso}`;
        }

        init();
    </script>
</body>
</html>
